# build_kernel_lname: Build kernel (lunaa)

# Values below come from the device trees of theleafir1 (branch lineage-23.2):
#   BoardConfigCommon.mk : TARGET_KERNEL_CONFIG := vendor/lahaina-qgki_defconfig
#                          BOARD_KERNEL_IMAGE_NAME := Image, boot header v3
#   BoardConfig.mk (lunaa): TARGET_KERNEL_CONFIG += vendor/oplus_yupik_QGKI.config

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repo (owner/name)"
        required: true
        default: "theleafir1/android_kernel_oneplus_sm8350"
      kernel_branch:
        description: "Branch (empty = repo default: lineage-23-base-lunaa-rebase-qualle)"
        required: false
        default: ""
      defconfig:
        description: "Base defconfig"
        required: true
        default: "vendor/lahaina-qgki_defconfig"
      extra_configs:
        description: "Config fragments merged on top (lunaa needs oplus_yupik)"
        required: false
        default: "vendor/oplus_yupik_QGKI.config"
      scmversion:
        description: "Kernel release suffix, must match the ROM's modules (see 'adb shell uname -r'). Empty = -g<12-char HEAD hash>"
        required: false
        default: ""
      ksu_ref:
        description: "KernelSU Next ref for setup.sh (tag or branch). Falls back to v3.4.2, then legacy, if the tag does not exist. 'none' = no KernelSU"
        required: true
        default: "v3.4.2-legacy"
      susfs:
        description: "Add SUSFS (needs ksu_ref != none). Fails the build if patches do not apply cleanly"
        type: boolean
        required: true
        default: true
      susfs_repo:
        description: "SUSFS git repo"
        required: true
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_branch:
        description: "SUSFS branch for your kernel version"
        required: true
        default: "kernel-5.4"
      ksu_kprobes:
        description: "Enable KPROBES for KernelSU hooks (set false if the kernel already has manual hooks)"
        type: boolean
        required: true
        default: true
      clang_repo:
        description: "Clang toolchain git repo"
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
      clang_branch:
        description: "Clang branch"
        required: true
        default: "master"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio zip unzip git make gcc ccache lz4 zstd python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel source
        run: |
          BRANCH_ARG=""
          if [ -n "${{ inputs.kernel_branch }}" ]; then
            BRANCH_ARG="-b ${{ inputs.kernel_branch }}"
          fi
          git clone --depth=1 --recurse-submodules $BRANCH_ARG \
            "https://github.com/${{ inputs.kernel_repo }}" kernel
          ls kernel/arch/arm64/configs/vendor | grep -E "lahaina|yupik" || true

      - name: Set kernel release suffix
        working-directory: kernel
        run: |
          # Vendor modules in vendor_dlkm are matched by version magic, so the
          # kernel release string must equal the one the ROM was built with.
          # Done before KernelSU touches the tree (avoids a "-dirty" suffix).
          if [ -n "${{ inputs.scmversion }}" ]; then
            SUFFIX="${{ inputs.scmversion }}"
          else
            SUFFIX="-g$(git rev-parse --short=12 HEAD)"
          fi
          printf '%s' "$SUFFIX" > .scmversion
          echo "scmversion: $SUFFIX"

      - name: Add KernelSU Next
        if: inputs.ksu_ref != 'none'
        working-directory: kernel
        run: |
          REF="${{ inputs.ksu_ref }}"
          OK=0
          for R in "$REF" "${REF%-legacy}" legacy; do
            echo "== trying KernelSU Next ref: $R"
            rm -rf KernelSU-Next drivers/kernelsu
            if curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
                 | bash -s "$R" && [ -d KernelSU-Next ]; then
              OK=1; echo "KernelSU Next ref used: $R"; break
            fi
          done
          [ "$OK" = 1 ] || { echo "::error::KernelSU Next setup failed"; exit 1; }
          ls -la drivers | grep -i kernelsu || true
          git -C KernelSU-Next describe --tags --always 2>/dev/null || true
          git -C KernelSU-Next log -1 --format='KernelSU-Next commit: %h %s' 2>/dev/null || true

      - name: Add SUSFS
        if: inputs.ksu_ref != 'none' && inputs.susfs
        working-directory: kernel
        run: |
          git clone --depth=1 -b "${{ inputs.susfs_branch }}" "${{ inputs.susfs_repo }}" ../susfs4ksu
          git -C ../susfs4ksu log -1 --format='SUSFS commit: %h %ad %s'
          P="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
          find "$P" -maxdepth 2 | head -40

          # new source files (if shipped separately from the patch)
          [ -d "$P/fs" ] && cp -rv "$P"/fs/* fs/ || true
          [ -d "$P/include/linux" ] && cp -rv "$P"/include/linux/* include/linux/ || true

          # kernel side
          KP=$(ls "$P"/50_add_susfs_in_kernel*.patch | head -n1)
          echo "Applying kernel patch: $KP"
          patch -p1 --no-backup-if-mismatch < "$KP" || true

          # KernelSU side
          KSP="$P/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSP" ]; then
            cp "$KSP" KernelSU-Next/
            (cd KernelSU-Next && patch -p1 --no-backup-if-mismatch < 10_enable_susfs_for_ksu.patch) || true
          fi

          if find . -name '*.rej' | grep -q .; then
            echo "::error::SUSFS patches did not apply cleanly. Rejected hunks:"
            find . -name '*.rej'
            exit 1
          fi

      - name: Clone clang
        run: |
          git clone --depth=1 -b "${{ inputs.clang_branch }}" \
            "${{ inputs.clang_repo }}" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Configure
        working-directory: kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          $MK "${{ inputs.defconfig }}"
          for frag in ${{ inputs.extra_configs }}; do
            $MK "$frag"
          done

          if [ "${{ inputs.ksu_ref }}" != "none" ]; then
            scripts/config --file out/.config -e KSU
            if [ "${{ inputs.ksu_kprobes }}" = "true" ]; then
              scripts/config --file out/.config \
                -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
            fi
            if [ "${{ inputs.susfs }}" = "true" ]; then
              scripts/config --file out/.config \
                -e KSU_SUSFS -e KSU_SUSFS_HAS_MAGIC_MOUNT \
                -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
                -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SPOOF_UNAME \
                -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP \
                -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            fi
            $MK olddefconfig
            grep -E "CONFIG_KSU|CONFIG_KPROBES" out/.config || true
          fi

      - name: Build
        working-directory: kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64
          MK="make -j$(nproc) O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          set -o pipefail
          $MK Image modules 2>&1 | tee ../build.log
          $MK dtbs 2>&1 | tee -a ../build.log || true
          echo "Kernel release: $(cat out/include/config/kernel.release)"

      - name: Make boot.img (header v3, kernel only)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          python3 mkbootimg/mkbootimg.py \
            --kernel kernel/out/arch/arm64/boot/Image \
            --header_version 3 \
            --os_version 16.0.0 \
            --os_patch_level 2025-06 \
            -o boot.img
          ls -la boot.img

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/LICENSE
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom kernel for lunaa (KernelSU Next)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lunaa
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AKEOF
          sed -i 's/^          //' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          zip -r9 "../lunaa-kernel-$(date +%Y%m%d).zip" . -x '.git*'

      - name: Collect modules
        run: |
          mkdir -p extra/modules
          cp kernel/out/include/config/kernel.release extra/ || true
          cp kernel/out/.config extra/config || true
          find kernel/out -name '*.ko' -exec cp {} extra/modules/ \; 2>/dev/null || true
          echo "Built modules: $(ls extra/modules | wc -l)"

      - name: Upload boot.img and zip
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-kernel
          path: |
            boot.img
            lunaa-kernel-*.zip

      - name: Upload config, release string and modules
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-config-and-modules
          path: extra/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
unaa
