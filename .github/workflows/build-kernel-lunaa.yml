name: Build kernel (lunaa)

# Values below come from the device trees of theleafir1 (branch lineage-23.2):
#   BoardConfigCommon.mk : TARGET_KERNEL_CONFIG := vendor/lahaina-qgki_defconfig
#                          BOARD_KERNEL_IMAGE_NAME := Image, boot header v3
#   BoardConfig.mk (lunaa): TARGET_KERNEL_CONFIG += vendor/oplus_yupik_QGKI.config
#
# KernelSU / SUSFS notes (kernel 5.4):
#   * Upstream KernelSU-Next 'dev' and the tag v3.4.2 target newer kernels and
#     fail on 5.4 (linux/pgtable.h does not exist before 5.8). Note that
#     setup.sh silently stays on the default branch when the ref is missing,
#     which is how the previous run ended up on the wrong branch.
#   * Upstream 'legacy' is for 5.4 but has no SUSFS. The fork sidex15/KernelSU-Next
#     (branch legacy-susfs-v2) is legacy + SUSFS v2 and only needs the kernel-side
#     patch from susfs4ksu (branch kernel-5.4).
#   * If SUSFS cannot be applied cleanly, the build falls back to upstream legacy
#     WITHOUT SUSFS instead of failing (set 'strict' = true to fail instead).

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repo (owner/name)"
        required: true
        default: "theleafir1/android_kernel_oneplus_sm8350"
      kernel_branch:
        description: "Branch (empty = repo default: lineage-23-base-lunaa-rebase-qualle)"
        required: false
        default: ""
      defconfig:
        description: "Base defconfig"
        required: true
        default: "vendor/lahaina-qgki_defconfig"
      extra_configs:
        description: "Config fragments merged on top (lunaa needs oplus_yupik)"
        required: false
        default: "vendor/oplus_yupik_QGKI.config"
      scmversion:
        description: "Kernel release suffix, must match the ROM's modules (see 'adb shell uname -r'). Empty = -g<12-char HEAD hash>"
        required: false
        default: ""
      ksu:
        description: "Add KernelSU Next"
        type: boolean
        required: true
        default: true
      ksu_hook:
        description: "KernelSU hook mode. syscall_table = for non-GKI 5.4 (recommended), kprobes = needs working kprobes, manual = kernel must already have hooks"
        type: choice
        required: true
        default: "syscall_table"
        options:
          - syscall_table
          - kprobes
          - manual
      susfs:
        description: "Add SUSFS (falls back to no SUSFS if patches do not apply, unless strict)"
        type: boolean
        required: true
        default: true
      strict:
        description: "Fail the build if SUSFS cannot be applied (instead of building without it)"
        type: boolean
        required: true
        default: false
      ksu_susfs_repo:
        description: "KernelSU Next fork that already contains SUSFS support (owner/name)"
        required: true
        default: "sidex15/KernelSU-Next"
      ksu_susfs_branch:
        description: "Branch of that fork for non-GKI 5.4 + SUSFS"
        required: true
        default: "legacy-susfs-v2"
      ksu_plain_branch:
        description: "Upstream KernelSU-Next branch used when SUSFS is off or fails (legacy = 4.x/5.4 kernels)"
        required: true
        default: "legacy"
      susfs_repo:
        description: "SUSFS git repo"
        required: true
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_branch:
        description: "SUSFS branch for your kernel version (latest commit of this branch is used)"
        required: true
        default: "kernel-5.4"
      clang_repo:
        description: "Clang toolchain git repo"
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
      clang_branch:
        description: "Clang branch"
        required: true
        default: "master"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio zip unzip git make gcc ccache lz4 zstd python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          BRANCH_ARG=""
          if [ -n "$KERNEL_BRANCH" ]; then
            BRANCH_ARG="-b $KERNEL_BRANCH"
          fi
          git clone --depth=1 --recurse-submodules $BRANCH_ARG \
            "https://github.com/$KERNEL_REPO" kernel
          ls kernel/arch/arm64/configs/vendor | grep -E "lahaina|yupik" || true
          touch build.log

      - name: Set kernel release suffix
        working-directory: kernel
        env:
          SCMVERSION: ${{ inputs.scmversion }}
        run: |
          # Vendor modules in vendor_dlkm are matched by version magic, so the
          # kernel release string must equal the one the ROM was built with.
          # Done before KernelSU touches the tree (avoids a "-dirty" suffix).
          if [ -n "$SCMVERSION" ]; then
            SUFFIX="$SCMVERSION"
          else
            SUFFIX="-g$(git rev-parse --short=12 HEAD)"
          fi
          printf '%s' "$SUFFIX" > .scmversion
          echo "scmversion: $SUFFIX"

      - name: Add KernelSU Next (+ SUSFS)
        if: inputs.ksu
        working-directory: kernel
        env:
          WANT_SUSFS: ${{ inputs.susfs }}
          STRICT: ${{ inputs.strict }}
          KSU_SUSFS_REPO: ${{ inputs.ksu_susfs_repo }}
          KSU_SUSFS_BRANCH: ${{ inputs.ksu_susfs_branch }}
          KSU_PLAIN_REPO: KernelSU-Next/KernelSU-Next
          KSU_PLAIN_BRANCH: ${{ inputs.ksu_plain_branch }}
          SUSFS_REPO: ${{ inputs.susfs_repo }}
          SUSFS_BRANCH: ${{ inputs.susfs_branch }}
        run: |
          set -uo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1

          K="$PWD"
          ADDED="$GITHUB_WORKSPACE/susfs_added_files.txt"
          : > "$ADDED"

          # --- KernelSU Next: same layout that its setup.sh creates -----------
          # Full (non-shallow) clone on purpose: the Kbuild derives the version
          # and tag from git history.
          setup_ksu() {
            local repo="$1" branch="$2"
            echo "== KernelSU Next: $repo @ $branch"
            rm -rf KernelSU-Next drivers/kernelsu
            git clone --single-branch -b "$branch" "https://github.com/$repo" KernelSU-Next || return 1
            [ -d KernelSU-Next/kernel ] || return 1
            ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
            grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
            grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            # Kernel 5.4 has no linux/pgtable.h (added in 5.8); asm/pgtable.h is the 5.4 equivalent
            if [ ! -f include/linux/pgtable.h ]; then
              grep -rl 'linux/pgtable.h' KernelSU-Next/kernel 2>/dev/null \
                | xargs -r sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|'
              echo "pgtable.h include patched to asm/pgtable.h"
            fi
            git -C KernelSU-Next log -1 --format='KernelSU-Next commit: %h %ad %s'
            git -C KernelSU-Next describe --tags --always 2>/dev/null || true
          }

          # --- SUSFS kernel-side patch: dry-run first, apply only if clean -----
          apply_susfs() {
            rm -rf "$GITHUB_WORKSPACE/susfs4ksu"
            git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" "$GITHUB_WORKSPACE/susfs4ksu" || return 1
            git -C "$GITHUB_WORKSPACE/susfs4ksu" log -1 --format='SUSFS commit: %h %ad %s'
            local P="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
            find "$P" -maxdepth 2 | head -40

            local KP
            KP=$(ls "$P"/50_add_susfs_in_kernel*.patch 2>/dev/null | head -n1)
            [ -n "$KP" ] || { echo "no kernel patch found in $P"; return 1; }
            echo "Kernel patch: $KP"

            if ! patch -p1 --dry-run --no-backup-if-mismatch < "$KP"; then
              echo "SUSFS kernel patch does not apply cleanly (dry-run)"
              return 1
            fi

            # new source files shipped next to the patch
            local f rel
            if [ -d "$P/fs" ]; then
              for f in "$P"/fs/*; do rel="fs/$(basename "$f")"; cp -v "$f" "$rel" && echo "$rel" >> "$ADDED"; done
            fi
            if [ -d "$P/include/linux" ]; then
              for f in "$P"/include/linux/*; do rel="include/linux/$(basename "$f")"; cp -v "$f" "$rel" && echo "$rel" >> "$ADDED"; done
            fi

            patch -p1 --no-backup-if-mismatch < "$KP" || return 1
            if find . -name '*.rej' -not -path './KernelSU-Next/*' | grep -q .; then
              find . -name '*.rej'
              return 1
            fi
            grep -rhE "SUSFS_VERSION" include/linux/susfs*.h 2>/dev/null | head -3 || true
            return 0
          }

          revert_susfs() {
            git checkout -- . 2>/dev/null || true
            while read -r f; do [ -n "$f" ] && rm -f "$f"; done < "$ADDED"
            find . -name '*.rej' -o -name '*.orig' | grep -v '^./KernelSU-Next' | xargs -r rm -f
          }

          SUSFS_ON=0
          if [ "$WANT_SUSFS" = "true" ]; then
            if setup_ksu "$KSU_SUSFS_REPO" "$KSU_SUSFS_BRANCH" && apply_susfs; then
              SUSFS_ON=1
              echo "SUSFS: enabled"
            else
              if [ "$STRICT" = "true" ]; then
                echo "::error::SUSFS could not be applied and strict=true"
                exit 1
              fi
              echo "::warning::SUSFS could not be applied cleanly - building WITHOUT SUSFS (plain KernelSU Next $KSU_PLAIN_BRANCH)"
              revert_susfs
            fi
          fi

          if [ "$SUSFS_ON" = 0 ]; then
            setup_ksu "$KSU_PLAIN_REPO" "$KSU_PLAIN_BRANCH" || { echo "::error::KernelSU Next setup failed"; exit 1; }
          fi

          echo "SUSFS_ON=$SUSFS_ON" >> "$GITHUB_ENV"
          ls -la drivers | grep -i kernelsu || true

      - name: Clone clang
        run: |
          git clone --depth=1 -b "${{ inputs.clang_branch }}" \
            "${{ inputs.clang_repo }}" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Configure
        working-directory: kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          EXTRA_CONFIGS: ${{ inputs.extra_configs }}
          WANT_KSU: ${{ inputs.ksu }}
          KSU_HOOK: ${{ inputs.ksu_hook }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          $MK "$DEFCONFIG"
          for frag in $EXTRA_CONFIGS; do
            $MK "$frag"
          done

          if [ "$WANT_KSU" = "true" ]; then
            CFG="scripts/config --file out/.config"
            $CFG -e KSU
            case "$KSU_HOOK" in
              syscall_table)
                $CFG -d KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK -e KSU_SYSCALL_TABLE_HOOK ;;
              kprobes)
                $CFG -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -e KRETPROBES \
                     -d KSU_MANUAL_HOOK -d KSU_SYSCALL_TABLE_HOOK -e KSU_KPROBES_HOOK ;;
              manual)
                $CFG -e KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK -d KSU_SYSCALL_TABLE_HOOK ;;
            esac
            if [ "${SUSFS_ON:-0}" = "1" ]; then
              # sub-options (SUS_PATH, SUS_MOUNT, SUS_KSTAT, SPOOF_UNAME, ...) default to y in Kconfig
              $CFG -e KSU_SUSFS
            fi
            $MK olddefconfig

            echo "--- resulting KernelSU/SUSFS config"
            grep -E "^CONFIG_(KSU|KPROBES|KRETPROBES)" out/.config || true

            if ! grep -q '^CONFIG_KSU=y' out/.config; then
              echo "::error::CONFIG_KSU is not enabled after olddefconfig (Kconfig not hooked in?)"
              exit 1
            fi
            if [ "${SUSFS_ON:-0}" = "1" ] && ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "::warning::CONFIG_KSU_SUSFS was dropped by Kconfig (dependency not met) - SUSFS stays off"
              echo "SUSFS_ON=0" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build
        working-directory: kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          build() { set -o pipefail; $MK -j"$(nproc)" Image modules 2>&1 | tee -a ../build.log; }

          if ! build; then
            # Safety net: if SUSFS is on and the build broke, retry once without it
            if [ "${SUSFS_ON:-0}" = "1" ] && grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "::warning::Build failed with SUSFS - retrying once with CONFIG_KSU_SUSFS disabled"
              scripts/config --file out/.config -d KSU_SUSFS
              $MK olddefconfig
              echo "SUSFS_ON=0" >> "$GITHUB_ENV"
              build || FAILED=1
            else
              FAILED=1
            fi
          fi

          if [ "${FAILED:-0}" = "1" ]; then
            echo "::group::First errors"
            grep -nE "error:|\*\*\*|undefined reference" ../build.log | head -20 || true
            echo "::endgroup::"
            echo "::group::Single-threaded re-run for a readable error"
            $MK -j1 Image 2>&1 | tail -n 40 || true
            echo "::endgroup::"
            echo "::error::Kernel build failed - see the first errors above and the build-log artifact"
            exit 1
          fi

          $MK -j"$(nproc)" dtbs 2>&1 | tee -a ../build.log || true
          echo "Kernel release: $(cat out/include/config/kernel.release)"

      - name: Make boot.img (header v3, kernel only)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          python3 mkbootimg/mkbootimg.py \
            --kernel kernel/out/arch/arm64/boot/Image \
            --header_version 3 \
            --os_version 16.0.0 \
            --os_patch_level 2025-06 \
            -o boot.img
          ls -la boot.img

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/LICENSE
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom kernel for lunaa (KernelSU Next)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lunaa
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AKEOF
          sed -i 's/^          //' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          zip -r9 "../lunaa-kernel-$(date +%Y%m%d).zip" . -x '.git*'

      - name: Collect modules
        run: |
          mkdir -p extra/modules
          cp kernel/out/include/config/kernel.release extra/ || true
          cp kernel/out/.config extra/config || true
          find kernel/out -name '*.ko' -exec cp {} extra/modules/ \; 2>/dev/null || true
          echo "Built modules: $(ls extra/modules | wc -l)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build summary"
            echo "- Kernel release: \`$(cat kernel/out/include/config/kernel.release 2>/dev/null || echo n/a)\`"
            echo "- KernelSU: ${{ inputs.ksu }} (hook: ${{ inputs.ksu_hook }})"
            echo "- SUSFS: $([ "${SUSFS_ON:-0}" = 1 ] && echo enabled || echo 'NOT enabled')"
            grep -E "^CONFIG_KSU" kernel/out/.config 2>/dev/null | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot.img and zip
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-kernel
          path: |
            boot.img
            lunaa-kernel-*.zip

      - name: Upload config, release string and modules
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-config-and-modules
          path: extra/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
