name: Build KernelSU-Next Manager (ARM64 only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout KernelSU-Next source (manager + ksud)
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: v3.4.2
          path: KernelSU-Next
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package 'tools' no longer exists in the SDK repo
          # and makes sdkmanager fail with exit code 1.
          packages: ''

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build ARM64 ksud
        working-directory: KernelSU-Next
        run: |
          set -euxo pipefail
          # Show repo layout so the path is visible in the log
          ls -la
          # Locate ksud's Cargo.toml (its path differs between branches)
          KSUD_MANIFEST="$(grep -rl --include=Cargo.toml -E '^name *= *"ksud"' . | grep -v '/manager/' | head -n1)"
          test -n "$KSUD_MANIFEST"
          echo "Using manifest: $KSUD_MANIFEST"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release --manifest-path "$KSUD_MANIFEST"
          KSUD_BIN="$(find . -path '*aarch64-linux-android/release/ksud' -type f | head -n1)"
          test -n "$KSUD_BIN"
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          install -m 755 "$KSUD_BIN" manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Build standard Manager APK
        working-directory: KernelSU-Next/manager
        run: |
          set -euxo pipefail
          chmod +x gradlew setup.sh
          ./setup.sh
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify and collect APK
        working-directory: KernelSU-Next
        run: |
          set -euxo pipefail
          mkdir -p ../manager-apk
          find manager/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} ../manager-apk/ \;
          test -n "$(find ../manager-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh ../manager-apk

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Manager-ARM64
          path: manager-apk/*.apk
          if-no-files-found: error
          retention-days: 14
