name: Build KernelSU-Next Manager (ARM64 only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout KernelSU-Next legacy source
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: v3.4.0-legacy
          path: KernelSU-Next
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build ARM64 ksud
        working-directory: KernelSU-Next
        run: |
          set -euxo pipefail
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          install -m 755 userspace/ksud/target/aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Build standard Manager APK
        working-directory: KernelSU-Next/manager
        run: |
          set -euxo pipefail
          chmod +x gradlew setup.sh
          ./setup.sh
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify and collect APK
        working-directory: KernelSU-Next
        run: |
          set -euxo pipefail
          mkdir -p ../manager-apk
          find manager/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} ../manager-apk/ \;
          test -n "$(find ../manager-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh ../manager-apk

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Manager-ARM64
          path: manager-apk/*.apk
          if-no-files-found: error
          retention-days: 14
