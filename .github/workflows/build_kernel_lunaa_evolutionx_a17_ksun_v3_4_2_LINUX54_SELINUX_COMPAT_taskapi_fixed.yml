              "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n"
              "\tchar buffer[256];\n\tint ret = 0;\n"
              "#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif"
          )
          PY

          for spec in \
            'fs/exec.c:ksu_handle_execveat' \
            'fs/open.c:ksu_handle_faccessat' \
            'fs/read_write.c:ksu_handle_sys_read' \
            'fs/stat.c:ksu_handle_stat' \
            'kernel/reboot.c:ksu_handle_sys_reboot'; do
            file="${spec%%:*}"; symbol="${spec##*:}"
            grep -q "$symbol" "$file" || { echo "::error::$symbol missing from $file"; exit 1; }
          done
          echo "Official KernelSU Next v3.4.2 manual call sites applied"

      - name: Clone clang
        run: |
          git clone --depth=1 -b "${{ inputs.clang_branch }}" \
            "${{ inputs.clang_repo }}" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Configure
        working-directory: kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          EXTRA_CONFIGS: ${{ inputs.extra_configs }}
          WANT_KSU: ${{ inputs.ksu }}
          WANT_SUSFS: ${{ inputs.ksu && inputs.susfs }}
          SUSFS_EXTRA: ${{ inputs.susfs_extra }}
          HOOK_MODE: ${{ inputs.hook_mode }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          $MK "$DEFCONFIG"
          for frag in $EXTRA_CONFIGS; do
            $MK "$frag"
          done

          if [ "$WANT_KSU" = "true" ]; then
            scripts/config --file out/.config -e KSU
            # v3.4.2 Kconfig has no KSU_MANUAL_HOOK/KSU_KPROBE_HOOKS selector.
            # KPROBES is a hard dependency of CONFIG_KSU even when call sites are manual.
            scripts/config --file out/.config -e KPROBES -e KSU
            if [ "$WANT_SUSFS" = "true" ]; then
              scripts/config --file out/.config -e KPROBES
              scripts/config --file out/.config \
                -e OVERLAY_FS -e TMPFS_XATTR -e TMPFS_POSIX_ACL \
                -e SUSFS -e SUSFS_SUS_PATH -e SUSFS_SUS_MOUNT -e SUSFS_SUS_KSTAT \
                -e SUSFS_SPOOF_UNAME -e SUSFS_ENABLE_LOG -e SUSFS_HIDE_SUSFS_SYMBOLS \
                -e SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e SUSFS_OPEN_REDIRECT -e SUSFS_SUS_MAP
              if [ "$SUSFS_EXTRA" = "true" ]; then
                scripts/config --file out/.config -e SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e SUSFS_PRIORITY_UID_FILTER
              fi
            fi
          else
            scripts/config --file out/.config -d KSU
          fi
          $MK olddefconfig

          echo "--- resulting KernelSU config"
          grep -E "^CONFIG_(SUSFS|KSU|KPROBES|KRETPROBES|KALLSYMS|LTO_CLANG|CFI_CLANG)" out/.config || true

          if [ "$WANT_KSU" = "true" ]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU is not enabled"; exit 1; }
            if [ "$WANT_SUSFS" = "true" ]; then
              grep -q '^CONFIG_SUSFS=y' out/.config || { echo "::error::CONFIG_SUSFS is not enabled"; exit 1; }
              grep -q '^CONFIG_SUSFS_SUS_MOUNT=y' out/.config || { echo "::error::SUSFS sub-options were not enabled"; exit 1; }
              if [ "$SUSFS_EXTRA" = "true" ]; then
                grep -q '^CONFIG_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' out/.config || { echo "::error::SUSFS_HIDE_KSU_SUSFS_SYMBOLS not enabled"; exit 1; }
                grep -q '^CONFIG_SUSFS_PRIORITY_UID_FILTER=y' out/.config || { echo "::error::SUSFS_PRIORITY_UID_FILTER not enabled"; exit 1; }
              fi
            fi
            grep -q '^CONFIG_KPROBES=y' out/.config || { echo "::error::CONFIG_KPROBES dependency is not enabled"; exit 1; }
          fi

      - name: Fix KernelSU-Next Linux 5.4 header compatibility
        if: inputs.ksu
        working-directory: kernel
        run: |
          set -euo pipefail

          # Linux 5.4 has min()/max() in linux/kernel.h, not linux/minmax.h.
          FILE="KernelSU-Next/kernel/sulog/event.c"
          test -f "$FILE" || { echo "::error::KernelSU-Next sulog/event.c not found"; exit 1; }
          if grep -q '^#include <linux/minmax.h>$' "$FILE"; then
            sed -i 's|^#include <linux/minmax.h>$|#include <linux/kernel.h>|' "$FILE"
            echo "sulog/event.c: replaced linux/minmax.h with linux/kernel.h"
          elif grep -q '^#include <linux/kernel.h>$' "$FILE"; then
            echo "sulog/event.c: minmax compatibility already applied"
          else
            echo "::error::Unexpected includes in $FILE; refusing an unverified edit"
            grep -n '^#include' "$FILE" | head -20
            exit 1
          fi
          ! grep -q 'linux/minmax.h' "$FILE"

          # Linux 5.4 declares tasklist_lock, init_task, task_pgrp() and
          # task_session() in linux/sched/signal.h.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/supercall/dispatch.c")
          s = p.read_text()
          include = "#include <linux/sched/signal.h>"
          if include not in s:
              anchor = "#include <linux/sched.h>"
              if anchor not in s:
                  raise SystemExit("dispatch.c: linux/sched.h include anchor not found; refusing an unverified edit")
              s = s.replace(anchor, anchor + "\n" + include, 1)
              p.write_text(s)
              print("dispatch.c: added linux/sched/signal.h for Linux 5.4 task APIs")
          else:
              print("dispatch.c: linux/sched/signal.h already included")
          PY
          grep -q '^#include <linux/sched/signal.h>$' KernelSU-Next/kernel/supercall/dispatch.c

      - name: Build
        working-directory: kernel
        env:
          # Kbuild: "ifndef KSU_NEXT_MANAGER_SIZE/HASH" -> an empty value keeps the official defaults.
          # With build_manager the kernel accepts ONLY the APK built in the manager job.
          KSU_NEXT_MANAGER_SIZE: ${{ needs.manager.outputs.cert_size }}
          KSU_NEXT_MANAGER_HASH: ${{ needs.manager.outputs.cert_hash }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          echo "Manager signature for the kernel: size=${KSU_NEXT_MANAGER_SIZE:-default} hash=${KSU_NEXT_MANAGER_HASH:-default}"
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          # without pipefail the exit code of 'tee' hides a failed make
          set -o pipefail
          if ! $MK -j"$(nproc)" Image modules 2>&1 | tee -a ../build.log; then
            echo "::group::First errors"
            grep -nE "error:|\*\*\*|undefined reference" ../build.log | head -20 || true
            echo "::endgroup::"
            echo "::group::Single-threaded re-run for a readable error"
            $MK -j1 Image 2>&1 | tail -n 40 || true
            echo "::endgroup::"
            echo "::error::Kernel build failed - see the first errors above and the build-log artifact"
            exit 1
          fi

          $MK -j"$(nproc)" dtbs 2>&1 | tee -a ../build.log || true
          ACTUAL_RELEASE="$(cat out/include/config/kernel.release)"
          EXPECTED_RELEASE="${{ inputs.expected_kernel_release }}"
          echo "Kernel release: $ACTUAL_RELEASE"
          if [ "$ACTUAL_RELEASE" != "$EXPECTED_RELEASE" ]; then
            echo "::error::Kernel release mismatch: expected $EXPECTED_RELEASE, got $ACTUAL_RELEASE"; exit 1
          fi

      - name: Verify result
        working-directory: kernel
        env:
          WANT_KSU: ${{ inputs.ksu }}
          KSU_NEXT_MANAGER_HASH: ${{ needs.manager.outputs.cert_hash }}
        run: |
          REL="$(cat out/include/config/kernel.release)"
          EXPECTED_RELEASE="${{ inputs.expected_kernel_release }}"
          echo "Kernel release: $REL"
          test "$REL" = "$EXPECTED_RELEASE" || { echo "::error::kernel release mismatch"; exit 1; }
          if [ "$WANT_KSU" = "true" ]; then
            grep -q ' ksu_' out/System.map || { echo "::error::no ksu_* symbols in System.map - KernelSU was not linked"; exit 1; }
            echo "KernelSU symbols present: $(grep -c ' ksu_' out/System.map)"
            if [ "${{ inputs.susfs }}" = "true" ]; then
              grep -q ' susfs_' out/System.map || { echo "::error::no susfs_* symbols in System.map - SUSFS was not linked"; exit 1; }
              echo "SUSFS symbols present: $(grep -c ' susfs_' out/System.map)"
            fi
            if [ "${{ inputs.hook_mode }}" = "manual" ]; then
              for s in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_sys_read; do
                grep -q " $s\$" out/System.map || { echo "::error::$s missing from System.map"; exit 1; }
              done
              echo "manual hook symbols linked"
            fi
            grep -q ' ksu_handle_sys_reboot' out/System.map || { echo "::error::ksu_handle_sys_reboot missing"; exit 1; }
            grep -q 'ksu_handle_sys_reboot' kernel/reboot.c || { echo "::error::reboot hook not applied to kernel/reboot.c"; exit 1; }
          fi
          if [ -n "$KSU_NEXT_MANAGER_HASH" ]; then
            grep -q "Manager signature hash: $KSU_NEXT_MANAGER_HASH" ../build.log || { echo "::error::custom manager signature hash was not picked up by Kbuild"; exit 1; }
            echo "Custom manager signature is in the kernel"
          fi
          case "$REL" in
            *-dirty) echo "::warning::kernel release ends with -dirty - vendor modules will not match the ROM" ;;
          esac

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/LICENSE
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom kernel for lunaa / EvolutionX Android 17 (KernelSU Next v3.4.2 Manual Hooks)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lunaa
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=none;
          PATCH_VBMETA_FLAG=auto;
          NO_MAGISK_CHECK=1;

          . tools/ak3-core.sh;

          # The stock boot ramdisk is lz4_legacy and magiskboot's decompression
          # of it aborts ("Splitting image failed"). Only the kernel is replaced,
          # so keep the ramdisk bytes untouched: unpack with -n (no decompress);
          # RAMDISK_COMPRESSION=none above makes repack use -n as well.
          magiskboot() {
            if [ "$1" = unpack ]; then
              shift;
              "$BIN/magiskboot" unpack -n "$@";
            else
              "$BIN/magiskboot" "$@";
            fi;
          }

          split_boot;
          flash_boot;
          AKEOF
          sed -i 's/^          //' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          zip -r9 "../lunaa-evolutionx-kernel-$(date +%Y%m%d).zip" . -x '.git*'

      - name: Collect modules
        run: |
          mkdir -p extra/modules
          cp kernel/out/include/config/kernel.release extra/ || true
          cp kernel/out/.config extra/config || true
          find kernel/out -name '*.ko' -exec cp {} extra/modules/ \; 2>/dev/null || true
          echo "Built modules: $(ls extra/modules | wc -l)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build summary"
            echo "- Kernel commit: \`$(git -C kernel rev-parse --short=12 HEAD 2>/dev/null || echo n/a)\`"
            echo "- Kernel release: \`$(cat kernel/out/include/config/kernel.release 2>/dev/null || echo n/a)\`"
            echo "- KernelSU Next: $(git -C kernel/KernelSU-Next describe --tags --always 2>/dev/null || echo none)"
            echo "- Manager APK: ${{ inputs.build_manager && 'built (artifact ksun-manager-apk)' || 'not built' }}, manager UAPI: \`${{ needs.manager.outputs.uapi }}\`"
            echo "- SUSFS: \`$(grep -E '^#define SUSFS_VERSION' kernel/include/linux/susfs.h 2>/dev/null | cut -d' ' -f3 || echo none)\`"
            grep -E "^CONFIG_(KSU|SUSFS)" kernel/out/.config 2>/dev/null | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-evolutionx-kernel
          path: |
            lunaa-evolutionx-kernel-*.zip

      - name: Upload config, release string and modules
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-config-and-modules
          path: extra/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
