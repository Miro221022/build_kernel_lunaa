      - name: Add KernelSU Next v3.4.2 manual hooks
        if: ${{ inputs.ksu && inputs.hook_mode == 'manual' }}
        working-directory: kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new.strip() in s:
                  print(f"{path}: already patched")
                  return
              if old not in s:
                  raise SystemExit(f"{path}: expected upstream anchor not found; refusing unsafe edit")
              p.write_text(s.replace(old, new, 1))
              print(f"{path}: patched")

          # execve + execveat + compat all converge here. This avoids the old
          # legacy-fork hooks in __do_execve_file and covers every entry path.
          replace_once(
              "fs/exec.c",
              "static int do_execveat_common(int fd, struct filename *filename,\n"
              "\t\t\t      struct user_arg_ptr argv,\n"
              "\t\t\t      struct user_arg_ptr envp,\n"
              "\t\t\t      int flags)\n"
              "{\n\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);\n}",
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
              "\t\t\t       void *argv, void *envp, int *flags);\n"
              "#endif\n\n"
              "static int do_execveat_common(int fd, struct filename *filename,\n"
              "\t\t\t      struct user_arg_ptr argv,\n"
              "\t\t\t      struct user_arg_ptr envp,\n"
              "\t\t\t      int flags)\n"
              "{\n"
              "#ifdef CONFIG_KSU\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n"
              "\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);\n}"
          )

          # access/faccessat syscall hook (before permission/path processing).
          replace_once(
              "fs/open.c",
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n\treturn do_faccessat(dfd, filename, mode);\n}",
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
              "\t\t\t\t int *mode, int *flags);\n"
              "#endif\n\n"
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n"
              "{\n#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n"
              "\treturn do_faccessat(dfd, filename, mode);\n}"
          )

          # read(2): use the actual v3.4.2 handler signature and feature gate.
          replace_once(
              "fs/read_write.c",
              "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n\treturn ksys_read(fd, buf, count);\n}",
