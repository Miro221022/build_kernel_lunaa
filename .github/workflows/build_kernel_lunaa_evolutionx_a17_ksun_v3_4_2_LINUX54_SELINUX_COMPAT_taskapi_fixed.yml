name: Build kernel (lunaa, EvolutionX Android 17, KernelSU Next Stable, v3.4.2)

# ROM:    EvolutionX Android 17 for realme lunaa (RMX3363), kernel by pjgowtham
# Kernel: pjgowtham/android_kernel_oneplus_sm8350, branch lineage-24.0 (head 9dc2276af4b1, 2026-09-29),
#         5.4.302. The kernel release must equal `adb shell uname -r` of the ROM (vendor_dlkm modules);
#         if the ROM was built from another commit set kernel_commit and/or scmversion.
# Configs: vendor/lahaina-qgki_defconfig + vendor/oplus_yupik_QGKI.config
#
# This tree has NO built-in KernelSU/SUSFS (the "Strip" step detects that and skips itself), so:
#   SUSFS   : intentionally disabled in this first clean upstream-driver build
# Stable test profile: official KernelSU-Next v3.4.2 driver + manager, same UAPI enforced by CI.
# First pass: official KernelSU-Next v3.4.2 + upstream documented manual integration.
# SUSFS is disabled until the clean upstream driver is proven on-device.
# Manual call sites are adapted to this exact kernel commit; CONFIG_KPROBES remains a KSU dependency.
# This workflow has not yet been compiled end-to-end; inspect the first CI errors before flashing anything.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repo (owner/name)"
        required: true
        default: "pjgowtham/android_kernel_oneplus_sm8350"
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "lineage-24.0"
      kernel_commit:
        description: "Full commit SHA to build (default = tested head 2026-09-29; empty = current branch head). Set it to the ROM's commit if uname -r differs"
        required: false
        default: "9dc2276af4b1e57b730caee382de2e9688f41280"
      defconfig:
        description: "Base defconfig"
        required: true
        default: "vendor/lahaina-qgki_defconfig"
      extra_configs:
        description: "Config fragments merged on top (lunaa needs oplus_yupik)"
        required: false
        default: "vendor/oplus_yupik_QGKI.config"
      expected_kernel_release:
        description: "Must exactly match the installed ROM kernel release"
        required: true
        default: "5.4.302-qgki-g9dc2276af4b1"
      scmversion:
        description: "Kernel release suffix. Empty = -g<12-char HEAD hash>; must match the ROM (see adb shell uname -r)"
        required: false
        default: ""
      ksu:
        description: "Build with KernelSU Next (false = plain kernel, for comparison/testing)"
        type: boolean
        required: true
        default: true
      ksu_repo:
        description: "KernelSU Next repo"
        required: true
        default: "KernelSU-Next/KernelSU-Next"
      ksu_branch:
        description: "Fallback branch only when ksu_ref is empty"
        required: true
        default: "next"
      ksu_ref:
        description: "Pinned KernelSU Next driver release (v3.4.2)"
        required: false
        default: "v3.4.2"
      susfs:
        description: "Add SUSFS (kernel side patch + SUSFS-enabled KernelSU Next driver). Needs ksu = true"
        type: boolean
        required: true
        default: false
      susfs_patch_ref:
        description: "Commit of JackA1ltman/NonGKI_Kernel_Build_2nd that provides susfs_patch_to_5.4.patch (default = newest, SUSFS v2.4.0)"
        required: true
        default: "4b0766bdf5d568b695dfbb19994788f14c636f2b"
      susfs_ksu_repo:
        description: "KernelSU Next fork with the SUSFS-enabled legacy driver (used instead of ksu_repo/ksu_branch when susfs = true)"
        required: true
        default: "Gamesmes90/KernelSU-Next"
      susfs_ksu_branch:
        description: "Branch of the SUSFS-enabled driver"
        required: true
        default: "legacy-susfs"
      susfs_ksu_ref:
        description: "Commit of the SUSFS-enabled driver (empty = branch head)"
        required: false
        default: "fbd7c23d19c7c7a64f823cb788526b91bbb96690"
      build_manager:
        description: "Also build the manager APK, signed with a key whose hash is baked into the kernel"
        type: boolean
        required: true
        default: true
      manager_ref:
        description: "Pinned Manager release; must match the kernel driver UAPI"
        required: true
        default: "v3.4.2"
      manager_spoofed:
        description: "Build the spoofed manager (random package name)"
        type: boolean
        required: true
        default: true
      susfs_extra:
        description: "Also enable the 2 SUSFS v2.4.0 features the driver does not define (HIDE_KSU_SUSFS_SYMBOLS, PRIORITY_UID_FILTER). Turn off if the build fails in these files"
        type: boolean
        required: false
        default: true
      hook_mode:
        description: "KernelSU Next integration method (official manual source hooks)"
        type: choice
        required: true
        default: "manual"
        options:
          - manual
      clang_repo:
        description: "Clang toolchain git repo"
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
      clang_branch:
        description: "Clang branch"
        required: true
        default: "master"

jobs:
  manager:
    if: ${{ inputs.build_manager }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      cert_size: ${{ steps.sign.outputs.cert_size }}
      cert_hash: ${{ steps.sign.outputs.cert_hash }}
      uapi: ${{ steps.src.outputs.uapi }}
    env:
      # Optional repo secrets: a FIXED key lets new APKs update the installed manager.
      # Without them a new throw-away key is made on every run (uninstall the old manager first).
      KSU_KEYSTORE_B64: ${{ secrets.KSU_KEYSTORE_B64 }}
      KSU_KEYSTORE_PASSWORD: ${{ secrets.KSU_KEYSTORE_PASSWORD }}
      KSU_KEY_ALIAS: ${{ secrets.KSU_KEY_ALIAS }}
      KSU_KEY_PASSWORD: ${{ secrets.KSU_KEY_PASSWORD }}
    steps:
      - name: Checkout KernelSU Next (manager + ksud)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ksu_repo }}
          ref: ${{ inputs.manager_ref }}
          path: KernelSU-Next
          fetch-depth: 0

      - name: Show manager source
        id: src
        working-directory: KernelSU-Next
        run: |
          git log -1 --format='Manager source: %h %ad %s' --date=short
          git describe --tags --always
          echo "commit count: $(git rev-list --count HEAD)"
          UAPI="$(grep -oE 'KERNEL_SU_UAPI_VERSION[[:space:]=]+[0-9]+' uapi/supercall.h | grep -oE '[0-9]+$' | head -n1)"
          echo "Manager source UAPI version: $UAPI"
          [ -n "$UAPI" ]
          echo "uapi=$UAPI" >> "$GITHUB_OUTPUT"

      - name: Spoof package id
        if: ${{ inputs.manager_spoofed }}
        working-directory: KernelSU-Next/manager
        run: |
          chmod +x spoof
          ./spoof

      - name: Prepare signing key
        id: sign
        working-directory: KernelSU-Next/manager
        run: |
          set -euo pipefail
          if [ -n "$KSU_KEYSTORE_B64" ]; then
            echo "Using the keystore from repo secrets"
            echo "$KSU_KEYSTORE_B64" | base64 -d > key.jks
            STOREPASS="$KSU_KEYSTORE_PASSWORD"; ALIAS="$KSU_KEY_ALIAS"; KEYPASS="$KSU_KEY_PASSWORD"
          else
            echo "::warning::No KSU_KEYSTORE_B64 secret - generating a throw-away key. Uninstall the old manager before installing this APK."
            STOREPASS="$(openssl rand -hex 12)"; ALIAS="ksunext"; KEYPASS="$STOREPASS"
            keytool -genkeypair -keystore key.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass "$STOREPASS" -keypass "$KEYPASS" -dname "CN=KernelSU-Next"
          fi
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$STOREPASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEYPASS"
          } >> gradle.properties

          # What the kernel checks (kernel/manager/apk_sign.c): size and sha256 of the signing certificate (DER)
          keytool -exportcert -keystore key.jks -alias "$ALIAS" -storepass "$STOREPASS" -file cert.der
          SIZE="$(stat -c %s cert.der)"
          HASH="$(sha256sum cert.der | cut -d' ' -f1)"
          rm -f cert.der
          echo "Certificate size: $SIZE"
          echo "Certificate sha256: $HASH"
          echo "cert_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up NDK (ksud / bindgen)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Set up Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - name: Install cross
        run: RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

      - name: Assemble LKM bootstrap
        working-directory: KernelSU-Next
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S

      - name: Build ksud (arm64)
        working-directory: KernelSU-Next
        env:
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android
            -I${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
        run: |
          set -euxo pipefail
          CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release \
            --manifest-path ./userspace/ksud/Cargo.toml
          KSUD_BIN="$(find userspace/ksud/target -path '*aarch64-linux-android/release/ksud' -type f | head -n1)"
          test -n "$KSUD_BIN"
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          install -m 755 "$KSUD_BIN" manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Build manager APK
        working-directory: KernelSU-Next/manager
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/manager-apk"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/manager-apk/"
          ls -lh "$GITHUB_WORKSPACE/manager-apk"

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: ksun-manager-apk
          path: manager-apk/*.apk
          if-no-files-found: error

  build:
    needs: manager
    # run the kernel when the manager job succeeded OR was skipped (build_manager = false)
    if: ${{ !cancelled() && (needs.manager.result == 'success' || needs.manager.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio zip unzip git make gcc ccache lz4 zstd python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Validate selected integration profile
        if: ${{ inputs.susfs }}
        run: |
          echo "::error::SUSFS is intentionally disabled in this clean official KernelSU Next v3.4.2 manual-hooks workflow. Run the plain KSU profile first."
          exit 1

      - name: Clone kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KERNEL_COMMIT: ${{ inputs.kernel_commit }}
        run: |
          touch build.log
          # blobless clone with full history: needed to reverse the in-tree SUSFS commits
          git clone --filter=blob:none --no-checkout -b "$KERNEL_BRANCH" \
            "https://github.com/$KERNEL_REPO" kernel
          cd kernel
          git checkout --detach "${KERNEL_COMMIT:-origin/$KERNEL_BRANCH}"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          echo "Kernel commit: $ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "9dc2276af4b1e57b730caee382de2e9688f41280" || {
            echo "::error::Unexpected kernel commit; update the pinned commit and release together."; exit 1;
          }
          test -f arch/arm64/configs/vendor/lahaina-qgki_defconfig
          test -f arch/arm64/configs/vendor/oplus_yupik_QGKI.config
          ls arch/arm64/configs/vendor | grep -E "lahaina|yupik"

      - name: Set kernel release suffix
        working-directory: kernel
        env:
          SCMVERSION: ${{ inputs.scmversion }}
        run: |
          # Done before any file in the tree is touched (avoids a "-dirty" suffix).
          if [ -n "$SCMVERSION" ]; then
            SUFFIX="$SCMVERSION"
          else
            SUFFIX="-g$(git rev-parse --short=12 HEAD)"
          fi
          printf '%s' "$SUFFIX" > .scmversion
          echo "scmversion: $SUFFIX"

      - name: Strip built-in SUSFS 2.1.0 and old KernelSU hooks
        if: ${{ inputs.ksu }}
        working-directory: kernel
        run: |
          set -euo pipefail
          if [ ! -f fs/susfs.c ]; then echo "tree has no built-in SUSFS - nothing to strip"; exit 0; fi
          # only for trees with built-in SUSFS 2.1.0 (theleafir1); pjgowtham's tree has none -> skipped above
          git diff 4dacc3094755^ 56a4a53fffac -- . ':!drivers/kernelsu' > ../series.patch
          wc -l ../series.patch
          git apply -R --reject --whitespace=nowarn ../series.patch || true
          # later commits changed the two fs/stat.c hunks: remove the leftovers by hand
          python3 - <<'PY'
          import re
          p = 'fs/stat.c'
          s = open(p).read()
          s = re.sub(r'#ifdef CONFIG_KSU_SUSFS\nextern bool ksu_vfs_read_hook;\nextern void ksu_handle_vfs_fstat\(int fd, loff_t \*kstat_size_ptr\);\n#endif // #ifdef CONFIG_KSU_SUSFS\n\n', '', s)
          s = re.sub(r'#ifdef CONFIG_KSU_SUSFS\n\t\tif \(ksu_vfs_read_hook\)\n\t\t\tksu_handle_vfs_fstat\(fd, &stat->size\);\n#endif // #ifdef CONFIG_KSU_SUSFS\n\n', '', s)
          open(p, 'w').write(s)
          PY
          rm -f fs/stat.c.rej fs/stat.c.orig
          if [ -n "$(find . -name '*.rej' -print -quit)" ]; then
            find . -name '*.rej'; echo "::error::unexpected rejects while stripping SUSFS"; exit 1
          fi
          if git grep -lE 'susfs|SUSFS|ksu_|CONFIG_KSU' -- fs kernel security drivers/input drivers/tty include; then
            echo "::error::leftovers of SUSFS/KernelSU in the tree (listed above)"; exit 1
          fi
          rm -rf drivers/kernelsu ../series.patch
          echo "tree stripped: no SUSFS, no KernelSU hooks"

      - name: Add SUSFS (kernel side)
        if: ${{ inputs.ksu && inputs.susfs }}
        working-directory: kernel
        env:
          SUSFS_PATCH_REF: ${{ inputs.susfs_patch_ref }}
        run: |
          set -euo pipefail
          curl -fsSL -o susfs.patch \
            "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${SUSFS_PATCH_REF}/Patches/Patch/susfs_patch_to_5.4.patch"
          wc -l susfs.patch
          git apply --reject --whitespace=fix susfs.patch || true

          # Known mismatch on this tree: fs/proc/fd.c hunk #2 (seq_show prints an extra ino: field here).
          # Apply the rejected hunk by hand, keeping the tree's own seq_printf.
          if [ -f fs/proc/fd.c.rej ]; then
          python3 - <<'PY'
          rej = open('fs/proc/fd.c.rej').read().split('\n')
          pre, post, seen = [], [], False
          for l in rej[1:]:
              if l.startswith('@@'): continue
              if l.startswith(' ') and 'seq_printf(m, "pos' in l: seen = True; continue
              if l.startswith('+'): (post if seen else pre).append(l[1:])
          assert pre and post, 'fd.c.rej not understood'
          s = open('fs/proc/fd.c').read()
          if 'bypass_orig_flow' not in s:
              i = s.index('\tseq_printf(m, "pos:\\t%lli')
              j = s.index(');\n', i) + 3
              s = s[:i] + '\n'.join(pre) + '\n' + s[i:j] + '\n'.join(post) + '\n' + s[j:]
              open('fs/proc/fd.c', 'w').write(s)
              print('fs/proc/fd.c: rejected hunk applied manually')
          PY
            rm -f fs/proc/fd.c.rej fs/proc/fd.c.orig
          fi
          if [ -n "$(find . -name '*.rej' -print -quit)" ]; then
            find . -name '*.rej'
            echo "::error::SUSFS patch has rejected hunks that are not handled"
            exit 1
          fi

          # The KernelSU Next legacy-susfs driver uses CONFIG_SUSFS* (not CONFIG_KSU_SUSFS*)
          # all files (not only `git status` ones: after the strip + patch some files equal HEAD again)
          grep -rlI 'CONFIG_KSU_SUSFS' fs include kernel security mm drivers init 2>/dev/null | \
            grep -E '\.(c|h)$|Makefile$|Kconfig$' | \
            while read -r f; do sed -i 's/CONFIG_KSU_SUSFS/CONFIG_SUSFS/g' "$f"; done
          # fs/stat.c uses susfs_is_current_app_uid()/STATX_SUS_KSTAT* but the patch never includes the header there
          grep -q 'linux/susfs_def.h' fs/stat.c || \
            sed -i '0,/#include <asm\/unistd.h>/s||#include <asm/unistd.h>\n#ifdef CONFIG_SUSFS\n#include <linux/susfs_def.h>\n#endif|' fs/stat.c
          grep -q 'linux/susfs_def.h' fs/stat.c
          rm -f susfs.patch
          test -f fs/susfs.c && test -f include/linux/susfs.h
          grep -q 'CONFIG_SUSFS' fs/Makefile
          echo "SUSFS kernel side added: $(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h)"

      - name: Add KernelSU Next
        if: inputs.ksu
        working-directory: kernel
        env:
          HOOK_MODE: ${{ inputs.hook_mode }}
          SUSFS_EXTRA: ${{ inputs.susfs_extra }}
          KSU_REPO: ${{ inputs.susfs && inputs.susfs_ksu_repo || inputs.ksu_repo }}
          KSU_BRANCH: ${{ inputs.susfs && inputs.susfs_ksu_branch || inputs.ksu_branch }}
          KSU_REF: ${{ inputs.susfs && inputs.susfs_ksu_ref || inputs.ksu_ref }}
        run: |
          set -euo pipefail

          # Clone without selecting a branch: the pinned v3.4.2 is a Git tag,
          # not a branch named "stable". Keep full history for Kbuild version metadata.
          git clone "https://github.com/$KSU_REPO" KernelSU-Next
          if [ -n "$KSU_REF" ]; then
            git -C KernelSU-Next fetch --tags --force
            git -C KernelSU-Next checkout --detach "$KSU_REF"
          else
            git -C KernelSU-Next checkout --detach "origin/$KSU_BRANCH"
          fi
          git -C KernelSU-Next log -1 --format='KernelSU-Next commit: %h %ad %s' --date=short
          git -C KernelSU-Next describe --tags --always || true
          [ -d KernelSU-Next/kernel/core ]

          # UAPI version of the driver. The manager must speak the same one.
          UAPI="$(grep -oE 'KERNEL_SU_UAPI_VERSION[[:space:]=]+[0-9]+' KernelSU-Next/uapi/supercall.h | grep -oE '[0-9]+$' | head -n1)"
          echo "KernelSU-Next driver UAPI version: $UAPI"
          MGR_UAPI="${{ needs.manager.outputs.uapi }}"
          if [ -n "$MGR_UAPI" ] && [ "$MGR_UAPI" != "$UAPI" ]; then
            echo "::error::driver UAPI ($UAPI) != manager UAPI ($MGR_UAPI). Change ksu_ref / manager_ref so they match."
            exit 1
          fi

      - name: Adapt KernelSU Next v3.4.2 observer to Linux 5.4 APIs
        if: inputs.ksu
        working-directory: kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/manager/pkg_observer.c")
          s = p.read_text()

          # Linux 5.4 task_work_add() takes a bool notify argument.
          # TWA_RESUME is from the newer enum-based API.
          old = "task_work_add(current, cb, TWA_RESUME)"
          new = "task_work_add(current, cb, true)"
          if old in s:
              s = s.replace(old, new, 1)
              print("pkg_observer.c: adapted task_work_add() notify argument")
          elif new in s:
              print("pkg_observer.c: task_work_add() already adapted")
          else:
              raise SystemExit("pkg_observer.c: task_work_add() anchor not found")

          # This kernel's fsnotify_ops uses handle_event(), with the
          # fsnotify_iter_info callback signature (not handle_inode_event()).
          old_sig = (
              "static int ksu_handle_inode_event(struct fsnotify_mark *mark, u32 mask,\n"
              "                                  struct inode *inode, struct inode *dir,\n"
              "                                  const struct qstr *file_name, u32 cookie)"
          )
          new_sig = (
              "static int ksu_handle_inode_event(struct fsnotify_group *group,\n"
              "                                  struct inode *inode, u32 mask,\n"
              "                                  const void *data, int data_type,\n"
              "                                  const struct qstr *file_name, u32 cookie,\n"
              "                                  struct fsnotify_iter_info *iter_info)"
          )
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
              print("pkg_observer.c: adapted fsnotify callback signature")
          elif new_sig in s:
              print("pkg_observer.c: fsnotify callback signature already adapted")
          else:
              raise SystemExit("pkg_observer.c: fsnotify callback signature anchor not found")

          old_ops = ".handle_inode_event = ksu_handle_inode_event,"
          new_ops = ".handle_event = ksu_handle_inode_event,"
          if old_ops in s:
              s = s.replace(old_ops, new_ops, 1)
              print("pkg_observer.c: switched fsnotify_ops member to handle_event")
          elif new_ops in s:
              print("pkg_observer.c: fsnotify_ops member already adapted")
          else:
              raise SystemExit("pkg_observer.c: fsnotify_ops initializer anchor not found")

          p.write_text(s)
          assert "TWA_RESUME" not in s
          assert ".handle_inode_event" not in s
          assert ".handle_event = ksu_handle_inode_event" in s
          print("KernelSU observer compatibility patch applied")
          PY

          # Fix KernelSU Next allowlist compatibility with Linux 5.4
          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/policy/allowlist.c")
          s = p.read_text()

          old = "task_work_add(tsk, cb, TWA_RESUME)"
          new = "task_work_add(tsk, cb, true)"

          if old in s:
              s = s.replace(old, new, 1)
              print("allowlist.c: adapted task_work_add()")
          elif new in s:
              print("allowlist.c: task_work_add() already adapted")
          else:
              raise SystemExit("ERROR: task_work_add() anchor not found")

          include = "#include <linux/sched/task.h>"
          if include not in s:
              pos = s.find("#include")
              if pos < 0:
                  raise SystemExit("ERROR: no include section found")
              s = s[:pos] + include + "\n" + s[pos:]

          p.write_text(s)

          assert "TWA_RESUME" not in s
          assert include in s
          print("KernelSU allowlist compatibility patch applied")
          PY

          # same as KernelSU-Next's setup.sh: symlink + Makefile + Kconfig
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # 5.4 has no linux/pgtable.h (added in 5.8); asm/pgtable.h is the 5.4 equivalent
          if [ ! -f include/linux/pgtable.h ]; then
            grep -rl 'linux/pgtable.h' KernelSU-Next/kernel | xargs -r sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|'
            echo "pgtable.h include fixed"
          fi

          # Manual integration does not patch syscall_table or patch_memory.c.

          # (manual mode gets this hook, and all others, in the "Add KernelSU manual hooks" step)
          # In syscall_table hook mode KernelSU hooks execve/execveat/faccessat/newfstatat,
          # but NOT reboot(): the manager talks to the kernel through reboot() (supercall).
          # Without this call the manager shows "Unsupported | Not integrated" although
          # KernelSU is compiled in. The call must run before the magic/CAP_SYS_BOOT checks.
          [ "${HOOK_MODE:-manual}" = "manual" ] || python3 - <<'PY'
          p = 'kernel/reboot.c'
          s = open(p).read()
          if 'ksu_handle_sys_reboot' not in s:
              k = 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{\n'
              assert k in s, 'reboot syscall definition not found'
