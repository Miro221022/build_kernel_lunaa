          mkdir -p ../ksu-selinux-source/kernel ../ksu-selinux-source/target
          cp -a KernelSU-Next/kernel/selinux ../ksu-selinux-source/kernel/
          cp security/selinux/include/security.h ../ksu-selinux-source/target/
          cp security/selinux/ss/policydb.h ../ksu-selinux-source/target/
          cp security/selinux/ss/services.h ../ksu-selinux-source/target/
          cp security/selinux/ss/hashtab.h ../ksu-selinux-source/target/
          cp security/selinux/ss/hashtab.c ../ksu-selinux-source/target/
          {
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "KernelSU-Next commit: $(git -C KernelSU-Next rev-parse HEAD)"
            echo "KernelSU-Next tag: $(git -C KernelSU-Next describe --tags --always)"
          } > ../ksu-selinux-source/versions.txt
          tar -czf ../ksu-selinux-compat-source.tar.gz -C .. ksu-selinux-source
          ls -lh ../ksu-selinux-compat-source.tar.gz

      - name: Upload KernelSU SELinux compatibility sources
        if: ${{ inputs.ksu && always() }}
