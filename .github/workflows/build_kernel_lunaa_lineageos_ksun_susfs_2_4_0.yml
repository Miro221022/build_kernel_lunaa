name: Build kernel (lunaa, LineageOS 24.0 + KernelSU Next + SUSFS)

# ROM:    pure LineageOS 24.0 (Android 17) for realme lunaa (RMX3360/61/63)
# Kernel: pjgowtham/android_kernel_oneplus_sm8350, branch lineage-24.0 (5.4.302-qgki).
#         This is the lineage-24.0 tree that carries the lunaa bits (vendor/oplus_yupik_QGKI.config,
#         jiiov under-display fingerprint driver). The official LineageOS/android_kernel_oneplus_sm8350
#         lineage-24.0 is newer but has NO oplus_yupik_QGKI.config, so it cannot build lunaa.
#         Default = branch head (as of 2026-11-11: 9dc2276af4b1, ROM string 5.4.302-qgki-g9dc2276af4b1).
# Configs (same as the device trees): vendor/lahaina-qgki_defconfig + vendor/oplus_yupik_QGKI.config
#
# KernelSU Next: driver = Gamesmes90/KernelSU-Next branch legacy-susfs (the only legacy driver with
#        SUSFS integration, CONFIG_SUSFS*), with the CURRENT official KernelSU-Next 'legacy' branch
#        merged on top in the workflow (input ksu_upstream_merge, 12 commits newer than the fork;
#        merges cleanly as of 2026-11-11). Manager is built from official KernelSU-Next 'dev'
#        (same UAPI 6 as legacy; the UAPI check below fails the build if they ever diverge).
# SUSFS: kernel side = JackA1ltman susfs_patch_to_5.4.patch from NonGKI_Kernel_Build_2nd 'mainline'
#        (branch head = always the newest, SUSFS v2.4.0 as of 2026-11-11 - additive over v2.3.0: new PRIORITY_UID_FILTER / sus_type /
#        AVD spoof pieces, existing function signatures unchanged). One hunk in fs/proc/fd.c is
#        rejected by this tree and applied by hand. To fall back to v2.3.0 set susfs_patch_ref to
#        118ac2bc4f8bc25a41f0aef0d766ddc977feaec3. Disable SUSFS with the "susfs" input.
#
# IMPORTANT: this tree has NO KernelSU and NO SUSFS and no hooks in fs/*. So KernelSU Next
# ('legacy' branch, non-GKI 4.9-5.4) is added from scratch. KPROBES hook mode is the default here;
# "syscall table patching" needs no changes in fs/exec.c, fs/open.c, ... and is kept as an option.
#
# Kernel release must equal the ROM's string, otherwise vendor_dlkm modules are
# rejected (version magic). Default suffix is -g<12-char hash> of the built commit; if your
# LineageOS build was made from an older kernel commit, pin it with kernel_commit (or force the
# string with scmversion).

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repo (owner/name)"
        required: true
        default: "pjgowtham/android_kernel_oneplus_sm8350"
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "lineage-24.0"
      kernel_commit:
        description: "Full commit SHA to build (pin it to the one your ROM was built from; empty = branch head = latest)"
        required: false
        default: ""
      defconfig:
        description: "Base defconfig"
        required: true
        default: "vendor/lahaina-qgki_defconfig"
      extra_configs:
        description: "Config fragments merged on top (lunaa needs oplus_yupik)"
        required: false
        default: "vendor/oplus_yupik_QGKI.config"
      scmversion:
        description: "Kernel release suffix. Empty = -g<12-char HEAD hash> (must match the ROM string, e.g. 5.4.302-qgki-g9dc2276af4b1)"
        required: false
        default: ""
      ksu:
        description: "Build with KernelSU Next (false = plain kernel, for comparison/testing)"
        type: boolean
        required: true
        default: true
      ksu_repo:
        description: "KernelSU Next repo"
        required: true
        default: "KernelSU-Next/KernelSU-Next"
      ksu_branch:
        description: "KernelSU Next branch (legacy = non-GKI kernels 4.9 - 5.4)"
        required: true
        default: "legacy"
      ksu_ref:
        description: "Optional tag/commit of the KernelSU Next DRIVER (kernel side). Empty = branch head (legacy HEAD = UAPI 6)"
        required: false
        default: ""
      susfs:
        description: "Add SUSFS (kernel side patch + SUSFS-enabled KernelSU Next driver). Needs ksu = true"
        type: boolean
        required: true
        default: true
      susfs_patch_ref:
        description: "Branch or commit of JackA1ltman/NonGKI_Kernel_Build_2nd that provides susfs_patch_to_5.4.patch (default 'mainline' = always the newest, SUSFS v2.4.0 as of 2026-11-11; to pin use a commit, e.g. e34397912802b6d8f07aeb6ebfd475eb5d841dfe = v2.4.0, 118ac2bc4f8bc25a41f0aef0d766ddc977feaec3 = v2.3.0)"
        required: true
        default: "mainline"
      susfs_ksu_repo:
        description: "KernelSU Next fork with the SUSFS-enabled legacy driver (used instead of ksu_repo/ksu_branch when susfs = true)"
        required: true
        default: "Gamesmes90/KernelSU-Next"
      susfs_ksu_branch:
        description: "Branch of the SUSFS-enabled driver"
        required: true
        default: "legacy-susfs"
      susfs_ksu_ref:
        description: "Commit of the SUSFS-enabled driver (default = current legacy-susfs head; empty = branch head)"
        required: false
        default: "fbd7c23d19c7c7a64f823cb788526b91bbb96690"
      ksu_upstream_merge:
        description: "Ref (branch/tag/commit) of the official ksu_repo that is merged into the SUSFS driver so it is on the latest legacy ('legacy' = branch head, 'none' = no merge). Only used when susfs = true"
        required: true
        default: "legacy"
      build_manager:
        description: "Also build the manager APK, signed with a key whose hash is baked into the kernel"
        type: boolean
        required: true
        default: true
      manager_ref:
        description: "Branch/tag/commit of KernelSU Next the MANAGER is built from (dev = UAPI 6, same as legacy HEAD). Its UAPI must equal the driver's"
        required: true
        default: "dev"
      manager_spoofed:
        description: "Build the spoofed manager (random package name)"
        type: boolean
        required: true
        default: true
      hook_mode:
        description: "KernelSU hook mode"
        type: choice
        required: true
        default: "kprobes"
        options:
          - syscall_table
          - kprobes
      clang_repo:
        description: "Clang toolchain git repo"
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
      clang_branch:
        description: "Clang branch"
        required: true
        default: "master"

jobs:
  manager:
    if: ${{ inputs.build_manager }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      cert_size: ${{ steps.sign.outputs.cert_size }}
      cert_hash: ${{ steps.sign.outputs.cert_hash }}
      uapi: ${{ steps.src.outputs.uapi }}
    env:
      # Optional repo secrets: a FIXED key lets new APKs update the installed manager.
      # Without them a new throw-away key is made on every run (uninstall the old manager first).
      KSU_KEYSTORE_B64: ${{ secrets.KSU_KEYSTORE_B64 }}
      KSU_KEYSTORE_PASSWORD: ${{ secrets.KSU_KEYSTORE_PASSWORD }}
      KSU_KEY_ALIAS: ${{ secrets.KSU_KEY_ALIAS }}
      KSU_KEY_PASSWORD: ${{ secrets.KSU_KEY_PASSWORD }}
    steps:
      - name: Checkout KernelSU Next (manager + ksud)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ksu_repo }}
          ref: ${{ inputs.manager_ref }}
          path: KernelSU-Next
          fetch-depth: 0

      - name: Show manager source
        id: src
        working-directory: KernelSU-Next
        run: |
          git log -1 --format='Manager source: %h %ad %s' --date=short
          git describe --tags --always
          echo "commit count: $(git rev-list --count HEAD)"
          UAPI="$(grep -oE 'KERNEL_SU_UAPI_VERSION[[:space:]=]+[0-9]+' uapi/supercall.h | grep -oE '[0-9]+$' | head -n1)"
          echo "Manager source UAPI version: $UAPI"
          [ -n "$UAPI" ]
          echo "uapi=$UAPI" >> "$GITHUB_OUTPUT"

      - name: Spoof package id
        if: ${{ inputs.manager_spoofed }}
        working-directory: KernelSU-Next/manager
        run: |
          chmod +x spoof
          ./spoof

      - name: Prepare signing key
        id: sign
        working-directory: KernelSU-Next/manager
        run: |
          set -euo pipefail
          if [ -n "$KSU_KEYSTORE_B64" ]; then
            echo "Using the keystore from repo secrets"
            echo "$KSU_KEYSTORE_B64" | base64 -d > key.jks
            STOREPASS="$KSU_KEYSTORE_PASSWORD"; ALIAS="$KSU_KEY_ALIAS"; KEYPASS="$KSU_KEY_PASSWORD"
          else
            echo "::warning::No KSU_KEYSTORE_B64 secret - generating a throw-away key. Uninstall the old manager before installing this APK."
            STOREPASS="$(openssl rand -hex 12)"; ALIAS="ksunext"; KEYPASS="$STOREPASS"
            keytool -genkeypair -keystore key.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass "$STOREPASS" -keypass "$KEYPASS" -dname "CN=KernelSU-Next"
          fi
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$STOREPASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEYPASS"
          } >> gradle.properties

          # What the kernel checks (kernel/manager/apk_sign.c): size and sha256 of the signing certificate (DER)
          keytool -exportcert -keystore key.jks -alias "$ALIAS" -storepass "$STOREPASS" -file cert.der
          SIZE="$(stat -c %s cert.der)"
          HASH="$(sha256sum cert.der | cut -d' ' -f1)"
          rm -f cert.der
          echo "Certificate size: $SIZE"
          echo "Certificate sha256: $HASH"
          echo "cert_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up NDK (ksud / bindgen)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Set up Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - name: Install cross
        run: RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

      - name: Assemble LKM bootstrap
        working-directory: KernelSU-Next
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S

      - name: Build ksud (arm64)
        working-directory: KernelSU-Next
        env:
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android
            -I${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
        run: |
          set -euxo pipefail
          CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release \
            --manifest-path ./userspace/ksud/Cargo.toml
          KSUD_BIN="$(find userspace/ksud/target -path '*aarch64-linux-android/release/ksud' -type f | head -n1)"
          test -n "$KSUD_BIN"
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          install -m 755 "$KSUD_BIN" manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Build manager APK
        working-directory: KernelSU-Next/manager
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/manager-apk"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/manager-apk/"
          ls -lh "$GITHUB_WORKSPACE/manager-apk"

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: ksun-manager-apk
          path: manager-apk/*.apk
          if-no-files-found: error

  build:
    needs: manager
    # run the kernel when the manager job succeeded OR was skipped (build_manager = false)
    if: ${{ !cancelled() && (needs.manager.result == 'success' || needs.manager.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio zip unzip git make gcc ccache lz4 zstd python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KERNEL_COMMIT: ${{ inputs.kernel_commit }}
        run: |
          touch build.log
          git clone --depth=1 --no-checkout -b "$KERNEL_BRANCH" \
            "https://github.com/$KERNEL_REPO" kernel
          cd kernel
          if [ -n "$KERNEL_COMMIT" ]; then
            git fetch --depth=1 origin "$KERNEL_COMMIT"
            git checkout --detach "$KERNEL_COMMIT"
          else
            git checkout --detach "origin/$KERNEL_BRANCH"
          fi
          git log -1 --format='Kernel commit: %H %s'
          ls arch/arm64/configs/vendor | grep -E "lahaina|yupik" || true

      - name: Set kernel release suffix
        working-directory: kernel
        env:
          SCMVERSION: ${{ inputs.scmversion }}
        run: |
          # Done before any file in the tree is touched (avoids a "-dirty" suffix).
          if [ -n "$SCMVERSION" ]; then
            SUFFIX="$SCMVERSION"
          else
            SUFFIX="-g$(git rev-parse --short=12 HEAD)"
          fi
          printf '%s' "$SUFFIX" > .scmversion
          echo "scmversion: $SUFFIX"

      - name: Add SUSFS (kernel side)
        if: ${{ inputs.ksu && inputs.susfs }}
        working-directory: kernel
        env:
          SUSFS_PATCH_REF: ${{ inputs.susfs_patch_ref }}
        run: |
          set -euo pipefail
          curl -fsSL -o susfs.patch \
            "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${SUSFS_PATCH_REF}/Patches/Patch/susfs_patch_to_5.4.patch"
          wc -l susfs.patch
          git apply --reject --whitespace=fix susfs.patch || true

          # Known mismatch on this tree: fs/proc/fd.c hunk #2 (seq_show prints an extra ino: field here).
          # Apply the rejected hunk by hand, keeping the tree's own seq_printf.
          if [ -f fs/proc/fd.c.rej ]; then
          python3 - <<'PY'
          rej = open('fs/proc/fd.c.rej').read().split('\n')
          pre, post, seen = [], [], False
          for l in rej[1:]:
              if l.startswith('@@'): continue
              if l.startswith(' ') and 'seq_printf(m, "pos' in l: seen = True; continue
              if l.startswith('+'): (post if seen else pre).append(l[1:])
          assert pre and post, 'fd.c.rej not understood'
          s = open('fs/proc/fd.c').read()
          if 'bypass_orig_flow' not in s:
              i = s.index('\tseq_printf(m, "pos:\\t%lli')
              j = s.index(');\n', i) + 3
              s = s[:i] + '\n'.join(pre) + '\n' + s[i:j] + '\n'.join(post) + '\n' + s[j:]
              open('fs/proc/fd.c', 'w').write(s)
              print('fs/proc/fd.c: rejected hunk applied manually')
          PY
            rm -f fs/proc/fd.c.rej fs/proc/fd.c.orig
          fi
          if [ -n "$(find . -name '*.rej' -print -quit)" ]; then
            find . -name '*.rej'
            echo "::error::SUSFS patch has rejected hunks that are not handled"
            exit 1
          fi

          # The KernelSU Next legacy-susfs driver uses CONFIG_SUSFS* (not CONFIG_KSU_SUSFS*)
          git status --porcelain | awk '{print $2}' | grep -E '\.(c|h)$|Makefile$|Kconfig$' | \
            xargs -r sed -i 's/CONFIG_KSU_SUSFS/CONFIG_SUSFS/g'
          # fs/stat.c uses susfs_is_current_app_uid()/STATX_SUS_KSTAT* but the patch never includes the header there
          grep -q 'linux/susfs_def.h' fs/stat.c || \
            sed -i '0,/#include <asm\/unistd.h>/s||#include <asm/unistd.h>\n#ifdef CONFIG_SUSFS\n#include <linux/susfs_def.h>\n#endif|' fs/stat.c
          grep -q 'linux/susfs_def.h' fs/stat.c
          rm -f susfs.patch
          test -f fs/susfs.c && test -f include/linux/susfs.h
          grep -q 'CONFIG_SUSFS' fs/Makefile
          echo "SUSFS kernel side added: $(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h)"

      - name: Add KernelSU Next
        if: inputs.ksu
        working-directory: kernel
        env:
          KSU_REPO: ${{ inputs.susfs && inputs.susfs_ksu_repo || inputs.ksu_repo }}
          KSU_BRANCH: ${{ inputs.susfs && inputs.susfs_ksu_branch || inputs.ksu_branch }}
          KSU_REF: ${{ inputs.susfs && inputs.susfs_ksu_ref || inputs.ksu_ref }}
          WANT_SUSFS: ${{ inputs.susfs }}
          KSU_UPSTREAM_REPO: ${{ inputs.ksu_repo }}
          KSU_UPSTREAM_REF: ${{ inputs.ksu_upstream_merge }}
        run: |
          set -euo pipefail

          # full clone on purpose: Kbuild derives version and tag from git history
          git clone --single-branch -b "$KSU_BRANCH" "https://github.com/$KSU_REPO" KernelSU-Next
          if [ -n "$KSU_REF" ]; then
            git -C KernelSU-Next checkout --detach "$KSU_REF"
          fi
          git -C KernelSU-Next log -1 --format='KernelSU-Next driver base: %h %ad %s' --date=short

          # The SUSFS fork lags behind official legacy: merge the current official legacy on top.
          if [ "$WANT_SUSFS" = "true" ] && [ -n "$KSU_UPSTREAM_REF" ] && [ "$KSU_UPSTREAM_REF" != "none" ]; then
            git -C KernelSU-Next fetch --no-tags "https://github.com/$KSU_UPSTREAM_REPO" "$KSU_UPSTREAM_REF"
            echo "Merging official $KSU_UPSTREAM_REPO $KSU_UPSTREAM_REF: $(git -C KernelSU-Next log -1 --format='%h %ad %s' --date=short FETCH_HEAD)"
            if ! git -C KernelSU-Next -c user.email=ci@localhost -c user.name=ci merge --no-edit FETCH_HEAD; then
              git -C KernelSU-Next diff --name-only --diff-filter=U
              echo "::error::merging official KernelSU-Next into the SUSFS driver conflicts - set ksu_upstream_merge to none (or a commit the fork can merge)"
              exit 1
            fi
          fi
          git -C KernelSU-Next log -1 --format='KernelSU-Next commit: %h %ad %s' --date=short
          git -C KernelSU-Next describe --tags --always || true
          [ -d KernelSU-Next/kernel/core ]

          # UAPI version of the driver. The manager must speak the same one.
          UAPI="$(grep -oE 'KERNEL_SU_UAPI_VERSION[[:space:]=]+[0-9]+' KernelSU-Next/uapi/supercall.h | grep -oE '[0-9]+$' | head -n1)"
          echo "KernelSU-Next driver UAPI version: $UAPI"
          MGR_UAPI="${{ needs.manager.outputs.uapi }}"
          if [ -n "$MGR_UAPI" ] && [ "$MGR_UAPI" != "$UAPI" ]; then
            echo "::error::driver UAPI ($UAPI) != manager UAPI ($MGR_UAPI). Change ksu_ref / manager_ref so they match."
            exit 1
          fi

          # same as KernelSU-Next's setup.sh: symlink + Makefile + Kconfig
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # 5.4 has no linux/pgtable.h (added in 5.8); asm/pgtable.h is the 5.4 equivalent
          if [ ! -f include/linux/pgtable.h ]; then
            grep -rl 'linux/pgtable.h' KernelSU-Next/kernel | xargs -r sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|'
            echo "pgtable.h include fixed"
          fi

          # KernelSU defines copy_to_kernel_nofault() as a macro for kernels < 5.8, but
          # this 5.4.302 tree already has the real function (backported) -> the macro
          # breaks include/linux/uaccess.h. Drop the macro block.
          python3 - <<'PY'
          p = 'KernelSU-Next/kernel/hook/patch_memory.c'
          s = open(p).read()
          a = s.find('// copy_to_kernel_nofault() was introduced')
          if a != -1 and 'static inline' not in s[a:a + 400]:
              b = s.index('#endif', a) + len('#endif')
              s = s[:a] + s[b:]
              open(p, 'w').write(s)
              print('copy_to_kernel_nofault macro removed')
          PY

          # syscall_table mode failed on the device with "failed to find phy addr for patch dst
          # addr" (0/4 syscalls hooked): phys_from_virt() walks the page tables and rejects 2MB/1GB
          # section mappings on 5.4 (pmd_bad()/pud_bad() are true for them, and pmd_leaf() does not
          # exist here). sys_call_table is in the kernel image, so translate it directly.
          python3 - <<'PY'
          p = 'KernelSU-Next/kernel/hook/patch_memory.c'
          s = open(p).read()
          k = "    *err = 0;\n\n    pgd = pgd_offset(mm, addr);"
          assert k in s, 'phys_from_virt not found'
          if '__pa_symbol' not in s:
              s = s.replace(k, "    *err = 0;\n\n    /* kernel image: avoid the page-table walk, it rejects section mappings on 5.4 */\n    if (addr >= (unsigned long)_text && addr < (unsigned long)_end)\n        return __pa_symbol(addr);\n\n    pgd = pgd_offset(mm, addr);", 1)
              s = s.replace('#include "asm-generic/fixmap.h"\n', '#include "asm-generic/fixmap.h"\n#include <asm/sections.h>\n', 1)
              open(p, 'w').write(s)
              print('phys_from_virt: kernel image shortcut added')
          PY

          # In syscall_table hook mode KernelSU hooks execve/execveat/faccessat/newfstatat,
          # but NOT reboot(): the manager talks to the kernel through reboot() (supercall).
          # Without this call the manager shows "Unsupported | Not integrated" although
          # KernelSU is compiled in. The call must run before the magic/CAP_SYS_BOOT checks.
          python3 - <<'PY'
          p = 'kernel/reboot.c'
          s = open(p).read()
          if 'ksu_handle_sys_reboot' not in s:
              k = 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{\n'
              assert k in s, 'reboot syscall definition not found'
              i = s.index(k)
              s = s[:i] + 'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n\t\t\t\t  void __user **arg);\n\n' + s[i:]
              j = s.index('\tint ret = 0;\n', s.index(k)) + len('\tint ret = 0;\n')
              s = s[:j] + '\n\t/* KernelSU-Next supercall entry */\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n' + s[j:]
              open(p, 'w').write(s)
              print('reboot hook added to kernel/reboot.c')
          PY

      - name: Bring the KernelSU Next SUSFS driver up to SUSFS v2.4.0
        if: ${{ inputs.ksu && inputs.susfs }}
        working-directory: kernel/KernelSU-Next
        run: |
          set -euo pipefail
          # The Gamesmes90 legacy-susfs driver predates SUSFS v2.4.0: it has no supercall for the
          # new priority-uid filter (CMD_SUSFS_SET_PRIORITY_UID_FILTER 0x60030) and no Kconfig
          # option for it, so the 2.4.0 kernel side would be built but could never be configured.
          python3 - <<'PY'
          import re
          # --- Kconfig: new SUSFS v2.4.0 option
          p = 'kernel/Kconfig'
          s = open(p).read()
          if 'config SUSFS_PRIORITY_UID_FILTER' not in s:
              opt = '''config SUSFS_PRIORITY_UID_FILTER
              bool "Enable to hide uids from apps that abuse the getpriority/setpriority syscalls"
              depends on SUSFS
              default y
              help
                  - SUSFS v2.4.0: hides the user-defined app uids (10000-19999) from the getpriority/setpriority uid probing.
                  - Effective only on user app processes (uid >= 10000).

          '''
              k = 'endmenu\n'
              i = s.index(k, s.index('menu "KernelSU - SUSFS"'))
              s = s[:i] + opt + s[i:]
              open(p, 'w').write(s)
              print('Kconfig: SUSFS_PRIORITY_UID_FILTER added')
          # --- supercall: CMD_SUSFS_SET_PRIORITY_UID_FILTER (0x60030)
          p = 'kernel/supercall/supercall.c'
          s = open(p).read()
          if 'CMD_SUSFS_SET_PRIORITY_UID_FILTER' not in s:
              k = '        if (cmd == CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING) {'
              assert k in s, 'AVC log spoofing handler not found'
              add = '''#ifdef CONFIG_SUSFS_PRIORITY_UID_FILTER
                  if (cmd == CMD_SUSFS_SET_PRIORITY_UID_FILTER) {
                      susfs_set_priority_uid_filter(arg);
                      return 0;
                  }
          #endif // #ifdef CONFIG_SUSFS_PRIORITY_UID_FILTER
          '''
              s = s.replace(k, add + k, 1)
              open(p, 'w').write(s)
              print('supercall.c: CMD_SUSFS_SET_PRIORITY_UID_FILTER handler added')
          PY
          grep -q 'CMD_SUSFS_SET_PRIORITY_UID_FILTER' kernel/supercall/supercall.c
          grep -q 'config SUSFS_PRIORITY_UID_FILTER' kernel/Kconfig

      - name: Clone clang
        run: |
          git clone --depth=1 -b "${{ inputs.clang_branch }}" \
            "${{ inputs.clang_repo }}" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Configure
        working-directory: kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          EXTRA_CONFIGS: ${{ inputs.extra_configs }}
          WANT_KSU: ${{ inputs.ksu }}
          WANT_SUSFS: ${{ inputs.ksu && inputs.susfs }}
          HOOK_MODE: ${{ inputs.hook_mode }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          $MK "$DEFCONFIG"
          for frag in $EXTRA_CONFIGS; do
            $MK "$frag"
          done

          if [ "$WANT_KSU" = "true" ]; then
            scripts/config --file out/.config -e KSU
            if [ "$HOOK_MODE" = "kprobes" ]; then
              scripts/config --file out/.config -d KSU_SYSCALL_TABLE_HOOK -e KSU_KPROBES_HOOK
            else
              scripts/config --file out/.config -d KSU_KPROBES_HOOK -e KSU_SYSCALL_TABLE_HOOK
            fi
            if [ "$WANT_SUSFS" = "true" ]; then
              scripts/config --file out/.config \
                -e KPROBES -e OVERLAY_FS -e TMPFS_XATTR -e TMPFS_POSIX_ACL \
                -e SUSFS -e SUSFS_SUS_PATH -e SUSFS_SUS_MOUNT -e SUSFS_SUS_KSTAT \
                -e SUSFS_SPOOF_UNAME -e SUSFS_ENABLE_LOG -e SUSFS_HIDE_SUSFS_SYMBOLS \
                -e SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e SUSFS_OPEN_REDIRECT -e SUSFS_SUS_MAP \
                -e SUSFS_PRIORITY_UID_FILTER
            fi
          else
            scripts/config --file out/.config -d KSU
          fi
          $MK olddefconfig

          echo "--- resulting KernelSU config"
          grep -E "^CONFIG_(SUSFS|KSU|KPROBES|KRETPROBES|KALLSYMS|LTO_CLANG|CFI_CLANG)" out/.config || true

          if [ "$WANT_KSU" = "true" ]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU is not enabled"; exit 1; }
            if [ "$WANT_SUSFS" = "true" ]; then
              grep -q '^CONFIG_SUSFS=y' out/.config || { echo "::error::CONFIG_SUSFS is not enabled"; exit 1; }
              grep -q '^CONFIG_SUSFS_SUS_MOUNT=y' out/.config || { echo "::error::SUSFS sub-options were not enabled"; exit 1; }
              grep -q '^CONFIG_SUSFS_PRIORITY_UID_FILTER=y' out/.config || { echo "::error::SUSFS_PRIORITY_UID_FILTER was not enabled"; exit 1; }
            fi
            if [ "$HOOK_MODE" = "kprobes" ]; then
              grep -q '^CONFIG_KSU_KPROBES_HOOK=y' out/.config || { echo "::error::KPROBES hook not enabled"; exit 1; }
            else
              grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' out/.config || { echo "::error::SYSCALL_TABLE hook not enabled"; exit 1; }
            fi
          fi

      - name: Build
        working-directory: kernel
        env:
          # Kbuild: "ifndef KSU_NEXT_MANAGER_SIZE/HASH" -> an empty value keeps the official defaults.
          # With build_manager the kernel accepts ONLY the APK built in the manager job.
          KSU_NEXT_MANAGER_SIZE: ${{ needs.manager.outputs.cert_size }}
          KSU_NEXT_MANAGER_HASH: ${{ needs.manager.outputs.cert_hash }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          echo "Manager signature for the kernel: size=${KSU_NEXT_MANAGER_SIZE:-default} hash=${KSU_NEXT_MANAGER_HASH:-default}"
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          # without pipefail the exit code of 'tee' hides a failed make
          set -o pipefail
          if ! $MK -j"$(nproc)" Image modules 2>&1 | tee -a ../build.log; then
            echo "::group::First errors"
            grep -nE "error:|\*\*\*|undefined reference" ../build.log | head -20 || true
            echo "::endgroup::"
            echo "::group::Single-threaded re-run for a readable error"
            $MK -j1 Image 2>&1 | tail -n 40 || true
            echo "::endgroup::"
            echo "::error::Kernel build failed - see the first errors above and the build-log artifact"
            exit 1
          fi

          $MK -j"$(nproc)" dtbs 2>&1 | tee -a ../build.log || true
          echo "Kernel release: $(cat out/include/config/kernel.release)"

      - name: Verify result
        working-directory: kernel
        env:
          WANT_KSU: ${{ inputs.ksu }}
          KSU_NEXT_MANAGER_HASH: ${{ needs.manager.outputs.cert_hash }}
        run: |
          REL="$(cat out/include/config/kernel.release)"
          echo "Kernel release: $REL"
          if [ "$WANT_KSU" = "true" ]; then
            grep -q ' ksu_' out/System.map || { echo "::error::no ksu_* symbols in System.map - KernelSU was not linked"; exit 1; }
            echo "KernelSU symbols present: $(grep -c ' ksu_' out/System.map)"
            if [ "${{ inputs.susfs }}" = "true" ]; then
              grep -q ' susfs_' out/System.map || { echo "::error::no susfs_* symbols in System.map - SUSFS was not linked"; exit 1; }
              echo "SUSFS symbols present: $(grep -c ' susfs_' out/System.map)"
            fi
            grep -q ' ksu_handle_sys_reboot' out/System.map || { echo "::error::ksu_handle_sys_reboot missing"; exit 1; }
            grep -q 'ksu_handle_sys_reboot' kernel/reboot.c 2>/dev/null || grep -q 'ksu_handle_sys_reboot' reboot.c 2>/dev/null || { echo "::error::reboot hook not applied to kernel/reboot.c"; exit 1; }
          fi
          if [ -n "$KSU_NEXT_MANAGER_HASH" ]; then
            grep -q "Manager signature hash: $KSU_NEXT_MANAGER_HASH" ../build.log || { echo "::error::custom manager signature hash was not picked up by Kbuild"; exit 1; }
            echo "Custom manager signature is in the kernel"
          fi
          case "$REL" in
            *-dirty) echo "::warning::kernel release ends with -dirty - vendor modules will not match the ROM" ;;
          esac

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/LICENSE
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom kernel for lunaa / LineageOS 24.0 (KernelSU Next + SUSFS)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lunaa
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=none;
          PATCH_VBMETA_FLAG=auto;
          NO_MAGISK_CHECK=1;

          . tools/ak3-core.sh;

          # The stock boot ramdisk is lz4_legacy and magiskboot's decompression
          # of it aborts ("Splitting image failed"). Only the kernel is replaced,
          # so keep the ramdisk bytes untouched: unpack with -n (no decompress);
          # RAMDISK_COMPRESSION=none above makes repack use -n as well.
          magiskboot() {
            if [ "$1" = unpack ]; then
              shift;
              "$BIN/magiskboot" unpack -n "$@";
            else
              "$BIN/magiskboot" "$@";
            fi;
          }

          split_boot;
          flash_boot;
          AKEOF
          sed -i 's/^          //' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          zip -r9 "../lunaa-lineageos-kernel-$(date +%Y%m%d).zip" . -x '.git*'

      - name: Collect modules
        run: |
          mkdir -p extra/modules
          cp kernel/out/include/config/kernel.release extra/ || true
          cp kernel/out/.config extra/config || true
          find kernel/out -name '*.ko' -exec cp {} extra/modules/ \; 2>/dev/null || true
          echo "Built modules: $(ls extra/modules | wc -l)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build summary"
            echo "- Kernel commit: \`$(git -C kernel rev-parse --short=12 HEAD 2>/dev/null || echo n/a)\`"
            echo "- Kernel release: \`$(cat kernel/out/include/config/kernel.release 2>/dev/null || echo n/a)\` (must equal the ROM kernel string)"
            echo "- KernelSU Next: $(git -C kernel/KernelSU-Next describe --tags --always 2>/dev/null || echo none)"
            echo "- Manager APK: ${{ inputs.build_manager && 'built (artifact ksun-manager-apk)' || 'not built' }}, manager UAPI: \`${{ needs.manager.outputs.uapi }}\`"
            echo "- SUSFS: \`$(grep -E '^#define SUSFS_VERSION' kernel/include/linux/susfs.h 2>/dev/null | cut -d' ' -f3 || echo none)\`"
            grep -E "^CONFIG_(KSU|SUSFS)" kernel/out/.config 2>/dev/null | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-lineageos-kernel
          path: |
            lunaa-lineageos-kernel-*.zip

      - name: Upload config, release string and modules
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-config-and-modules
          path: extra/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
