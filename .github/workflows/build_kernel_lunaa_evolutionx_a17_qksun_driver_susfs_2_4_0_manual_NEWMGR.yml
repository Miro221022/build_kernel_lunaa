name: Build kernel QKSUN driver + SUSFS 2.4.0 + MANUAL hooks + NEW MANAGER 204f0071 (lunaa, EvolutionX A17)

# *** NEWMGR variant: same kernel as the previous "..._manual" workflow; the MANAGER is built from KernelSU-Next dev 204f0071
# *** (newer than stable v3.4.2, has the startup-splash toggle) instead of v3.4.2. Artifacts and the zip carry "-newmgr".
#
# Kernel : pjgowtham/android_kernel_oneplus_sm8350, lineage-24.0, 9dc2276af4b1 (release 5.4.302-qgki-g9dc2276af4b1).
# SUSFS  : JackA1ltman susfs_patch_to_5.4.patch = SUSFS v2.4.0, kernel side, with its OWN names (CONFIG_KSU_SUSFS*).
# Driver : ONLY drivers/kernelsu of Quallenauge's kernel (lineage-24-base-lunaa-rebase-qualle, c8bea58fdcaf):
#          KernelSU Next "v3.4.2-legacy" (version 33355, UAPI 5). Its Kconfig also uses CONFIG_KSU_SUSFS*, so the
#          old CONFIG_KSU_SUSFS -> CONFIG_SUSFS rename of the Gamesmes90 flow is NOT done any more.
# Hooks  : MANUAL (default), inserted into the kernel source by the "Add KernelSU manual hooks" step (all 7 entry
#          points exist in this driver with the same names). hook_mode kprobes also works; syscall_table is not supported.
# Manager: must speak UAPI 5 like the driver. Default = KernelSU-Next dev commit 204f0071 (2026-10-16): the last commit before the
#          UAPI 6 bump (module preinit). It is newer than the stable v3.4.2 and has the startup-splash toggle (e3e4db36),
#          soft reboot and the other manager fixes. dev HEAD is UAPI 6 and is refused by the check; v3.4.2 also works.
# NOTE   : this driver was written and tested by its author against SUSFS v2.3.0 + KPROBES. Combining it with SUSFS 2.4.0
#          and manual hooks is NOT something anybody has built before. Dry-run here: patches apply, Kconfig resolves.
#          A full compile was not possible - read the first errors if it fails.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repo (owner/name)"
        required: true
        default: "pjgowtham/android_kernel_oneplus_sm8350"
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "lineage-24.0"
      kernel_commit:
        description: "Full commit SHA to build (default = tested head 2026-09-29; empty = current branch head). Set it to the ROM's commit if uname -r differs"
        required: false
        default: "9dc2276af4b1e57b730caee382de2e9688f41280"
      defconfig:
        description: "Base defconfig"
        required: true
        default: "vendor/lahaina-qgki_defconfig"
      extra_configs:
        description: "Config fragments merged on top (lunaa needs oplus_yupik)"
        required: false
        default: "vendor/oplus_yupik_QGKI.config"
      expected_kernel_release:
        description: "Must exactly match the installed ROM kernel release"
        required: true
        default: "5.4.302-qgki-g9dc2276af4b1"
      scmversion:
        description: "Kernel release suffix. Empty = -g<12-char HEAD hash>; must match the ROM (see adb shell uname -r)"
        required: false
        default: ""
      ksu:
        description: "Build with KernelSU Next (false = plain kernel, for comparison/testing)"
        type: boolean
        required: true
        default: true
      ksu_repo:
        description: "KernelSU Next repo the MANAGER (app + ksud) is built from"
        required: true
        default: "KernelSU-Next/KernelSU-Next"
      driver_repo:
        description: "Kernel repo whose drivers/kernelsu is used as the KernelSU Next driver (owner/name)"
        required: true
        default: "Quallenauge/android_kernel_oneplus_sm8350"
      driver_commit:
        description: "Full commit SHA of that repo (default = c8bea58fdcaf, driver v3.4.2-legacy, UAPI 5)"
        required: true
        default: "c8bea58fdcaf437eddce5871eec598acfa9ac8af"
      susfs:
        description: "Add SUSFS (kernel side patch + SUSFS-enabled KernelSU Next driver). Needs ksu = true"
        type: boolean
        required: true
        default: true
      susfs_patch_ref:
        description: "Commit of JackA1ltman/NonGKI_Kernel_Build_2nd that provides susfs_patch_to_5.4.patch (default = newest, SUSFS v2.4.0)"
        required: true
        default: "4b0766bdf5d568b695dfbb19994788f14c636f2b"
      build_manager:
        description: "Also build the manager APK, signed with a key whose hash is baked into the kernel"
        type: boolean
        required: true
        default: true
      manager_ref:
        description: "Commit/tag of KernelSU Next the MANAGER is built from. Must be UAPI 5 like the driver. Default 204f0071... = newest UAPI-5 commit (has the startup splash toggle). v3.4.2 = stable. Do NOT use dev (UAPI 6)"
        required: true
        default: "204f007164905395e280e9290cc7774f57af8c61"
      manager_spoofed:
        description: "Build the spoofed manager (random package name)"
        type: boolean
        required: true
        default: true
      susfs_extra:
        description: "Also enable the SUSFS v2.4.0 feature the driver's Kconfig does not define (PRIORITY_UID_FILTER)"
        type: boolean
        required: true
        default: true
      hook_mode:
        description: "KernelSU hook mode: manual (hooks inserted into the source, default) or kprobes. syscall_table is not supported with this driver"
        type: choice
        required: true
        default: "manual"
        options:
          - manual
          - kprobes
      clang_repo:
        description: "Clang toolchain git repo"
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
      clang_branch:
        description: "Clang branch"
        required: true
        default: "master"

jobs:
  manager:
    if: ${{ inputs.build_manager }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      cert_size: ${{ steps.sign.outputs.cert_size }}
      cert_hash: ${{ steps.sign.outputs.cert_hash }}
      uapi: ${{ steps.src.outputs.uapi }}
      min_kernel: ${{ steps.src.outputs.min_kernel }}
    env:
      # Optional repo secrets: a FIXED key lets new APKs update the installed manager.
      # Without them a new throw-away key is made on every run (uninstall the old manager first).
      KSU_KEYSTORE_B64: ${{ secrets.KSU_KEYSTORE_B64 }}
      KSU_KEYSTORE_PASSWORD: ${{ secrets.KSU_KEYSTORE_PASSWORD }}
      KSU_KEY_ALIAS: ${{ secrets.KSU_KEY_ALIAS }}
      KSU_KEY_PASSWORD: ${{ secrets.KSU_KEY_PASSWORD }}
    steps:
      - name: Checkout KernelSU Next (manager + ksud)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ksu_repo }}
          ref: ${{ inputs.manager_ref }}
          path: KernelSU-Next
          fetch-depth: 0

      - name: Show manager source
        id: src
        working-directory: KernelSU-Next
        run: |
          git log -1 --format='Manager source: %h %ad %s' --date=short
          git describe --tags --always
          echo "commit count: $(git rev-list --count HEAD)"
          UAPI="$(grep -oE 'KERNEL_SU_UAPI_VERSION[[:space:]=]+[0-9]+' uapi/supercall.h | grep -oE '[0-9]+$' | head -n1)"
          echo "Manager source UAPI version: $UAPI"
          [ -n "$UAPI" ]
          echo "uapi=$UAPI" >> "$GITHUB_OUTPUT"
          MINK="$(grep -rhoE 'MINIMAL_SUPPORTED_KERNEL[[:space:]]*=[[:space:]]*[0-9]+' manager/app/src/main/java | grep -oE '[0-9]+$' | head -n1 || true)"
          echo "Manager refuses kernels older than version: ${MINK:-unknown}"
          echo "min_kernel=${MINK}" >> "$GITHUB_OUTPUT"

      - name: Spoof package id
        if: ${{ inputs.manager_spoofed }}
        working-directory: KernelSU-Next/manager
        run: |
          chmod +x spoof
          ./spoof

      - name: Prepare signing key
        id: sign
        working-directory: KernelSU-Next/manager
        run: |
          set -euo pipefail
          if [ -n "$KSU_KEYSTORE_B64" ]; then
            echo "Using the keystore from repo secrets"
            echo "$KSU_KEYSTORE_B64" | base64 -d > key.jks
            STOREPASS="$KSU_KEYSTORE_PASSWORD"; ALIAS="$KSU_KEY_ALIAS"; KEYPASS="$KSU_KEY_PASSWORD"
          else
            echo "::warning::No KSU_KEYSTORE_B64 secret - generating a throw-away key. Uninstall the old manager before installing this APK."
            STOREPASS="$(openssl rand -hex 12)"; ALIAS="ksunext"; KEYPASS="$STOREPASS"
            keytool -genkeypair -keystore key.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass "$STOREPASS" -keypass "$KEYPASS" -dname "CN=KernelSU-Next"
          fi
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$STOREPASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEYPASS"
          } >> gradle.properties

          # What the kernel checks (kernel/manager/apk_sign.c): size and sha256 of the signing certificate (DER)
          keytool -exportcert -keystore key.jks -alias "$ALIAS" -storepass "$STOREPASS" -file cert.der
          SIZE="$(stat -c %s cert.der)"
          HASH="$(sha256sum cert.der | cut -d' ' -f1)"
          rm -f cert.der
          echo "Certificate size: $SIZE"
          echo "Certificate sha256: $HASH"
          echo "cert_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up NDK (ksud / bindgen)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Set up Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - name: Install cross
        run: RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

      - name: Assemble LKM bootstrap
        working-directory: KernelSU-Next
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S

      - name: Build ksud (arm64)
        working-directory: KernelSU-Next
        env:
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android
            -I${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
        run: |
          set -euxo pipefail
          CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release \
            --manifest-path ./userspace/ksud/Cargo.toml
          KSUD_BIN="$(find userspace/ksud/target -path '*aarch64-linux-android/release/ksud' -type f | head -n1)"
          test -n "$KSUD_BIN"
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          install -m 755 "$KSUD_BIN" manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Build manager APK
        working-directory: KernelSU-Next/manager
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/manager-apk"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/manager-apk/"
          ls -lh "$GITHUB_WORKSPACE/manager-apk"

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: ksun-manager-apk-newmgr
          path: manager-apk/*.apk
          if-no-files-found: error

  build:
    needs: manager
    # run the kernel when the manager job succeeded OR was skipped (build_manager = false)
    if: ${{ !cancelled() && (needs.manager.result == 'success' || needs.manager.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio zip unzip git make gcc ccache lz4 zstd python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          KERNEL_COMMIT: ${{ inputs.kernel_commit }}
        run: |
          touch build.log
          # blobless clone with full history: needed to reverse the in-tree SUSFS commits
          git clone --filter=blob:none --no-checkout -b "$KERNEL_BRANCH" \
            "https://github.com/$KERNEL_REPO" kernel
          cd kernel
          git checkout --detach "${KERNEL_COMMIT:-origin/$KERNEL_BRANCH}"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          echo "Kernel commit: $ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "9dc2276af4b1e57b730caee382de2e9688f41280" || {
            echo "::error::Unexpected kernel commit; update the pinned commit and release together."; exit 1;
          }
          test -f arch/arm64/configs/vendor/lahaina-qgki_defconfig
          test -f arch/arm64/configs/vendor/oplus_yupik_QGKI.config
          ls arch/arm64/configs/vendor | grep -E "lahaina|yupik"

      - name: Set kernel release suffix
        working-directory: kernel
        env:
          SCMVERSION: ${{ inputs.scmversion }}
        run: |
          # Done before any file in the tree is touched (avoids a "-dirty" suffix).
          if [ -n "$SCMVERSION" ]; then
            SUFFIX="$SCMVERSION"
          else
            SUFFIX="-g$(git rev-parse --short=12 HEAD)"
          fi
          printf '%s' "$SUFFIX" > .scmversion
          echo "scmversion: $SUFFIX"

      - name: Strip built-in SUSFS 2.1.0 and old KernelSU hooks
        if: ${{ inputs.ksu }}
        working-directory: kernel
        run: |
          set -euo pipefail
          if [ ! -f fs/susfs.c ]; then echo "tree has no built-in SUSFS - nothing to strip"; exit 0; fi
          # only for trees with built-in SUSFS 2.1.0 (theleafir1); pjgowtham's tree has none -> skipped above
          git diff 4dacc3094755^ 56a4a53fffac -- . ':!drivers/kernelsu' > ../series.patch
          wc -l ../series.patch
          git apply -R --reject --whitespace=nowarn ../series.patch || true
          # later commits changed the two fs/stat.c hunks: remove the leftovers by hand
          python3 - <<'PY'
          import re
          p = 'fs/stat.c'
          s = open(p).read()
          s = re.sub(r'#ifdef CONFIG_KSU_SUSFS\nextern bool ksu_vfs_read_hook;\nextern void ksu_handle_vfs_fstat\(int fd, loff_t \*kstat_size_ptr\);\n#endif // #ifdef CONFIG_KSU_SUSFS\n\n', '', s)
          s = re.sub(r'#ifdef CONFIG_KSU_SUSFS\n\t\tif \(ksu_vfs_read_hook\)\n\t\t\tksu_handle_vfs_fstat\(fd, &stat->size\);\n#endif // #ifdef CONFIG_KSU_SUSFS\n\n', '', s)
          open(p, 'w').write(s)
          PY
          rm -f fs/stat.c.rej fs/stat.c.orig
          if [ -n "$(find . -name '*.rej' -print -quit)" ]; then
            find . -name '*.rej'; echo "::error::unexpected rejects while stripping SUSFS"; exit 1
          fi
          if git grep -lE 'susfs|SUSFS|ksu_|CONFIG_KSU' -- fs kernel security drivers/input drivers/tty include; then
            echo "::error::leftovers of SUSFS/KernelSU in the tree (listed above)"; exit 1
          fi
          rm -rf drivers/kernelsu ../series.patch
          echo "tree stripped: no SUSFS, no KernelSU hooks"

      - name: Add SUSFS (kernel side)
        if: ${{ inputs.ksu && inputs.susfs }}
        working-directory: kernel
        env:
          SUSFS_PATCH_REF: ${{ inputs.susfs_patch_ref }}
        run: |
          set -euo pipefail
          curl -fsSL -o susfs.patch \
            "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${SUSFS_PATCH_REF}/Patches/Patch/susfs_patch_to_5.4.patch"
          wc -l susfs.patch
          git apply --reject --whitespace=fix susfs.patch || true

          # Known mismatch on this tree: fs/proc/fd.c hunk #2 (seq_show prints an extra ino: field here).
          # Apply the rejected hunk by hand, keeping the tree's own seq_printf.
          if [ -f fs/proc/fd.c.rej ]; then
          python3 - <<'PY'
          rej = open('fs/proc/fd.c.rej').read().split('\n')
          pre, post, seen = [], [], False
          for l in rej[1:]:
              if l.startswith('@@'): continue
              if l.startswith(' ') and 'seq_printf(m, "pos' in l: seen = True; continue
              if l.startswith('+'): (post if seen else pre).append(l[1:])
          assert pre and post, 'fd.c.rej not understood'
          s = open('fs/proc/fd.c').read()
          if 'bypass_orig_flow' not in s:
              i = s.index('\tseq_printf(m, "pos:\\t%lli')
              j = s.index(');\n', i) + 3
              s = s[:i] + '\n'.join(pre) + '\n' + s[i:j] + '\n'.join(post) + '\n' + s[j:]
              open('fs/proc/fd.c', 'w').write(s)
              print('fs/proc/fd.c: rejected hunk applied manually')
          PY
            rm -f fs/proc/fd.c.rej fs/proc/fd.c.orig
          fi
          if [ -n "$(find . -name '*.rej' -print -quit)" ]; then
            find . -name '*.rej'
            echo "::error::SUSFS patch has rejected hunks that are not handled"
            exit 1
          fi

          # The driver (Quallenauge) uses the same CONFIG_KSU_SUSFS* names as the 2.4.0 patch: no rename.
          # fs/stat.c uses susfs_is_current_app_uid()/STATX_SUS_KSTAT* but the patch never includes the header there
          grep -q 'linux/susfs_def.h' fs/stat.c || \
            sed -i '0,/#include <asm\/unistd.h>/s||#include <asm/unistd.h>\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif|' fs/stat.c
          grep -q 'linux/susfs_def.h' fs/stat.c
          rm -f susfs.patch
          test -f fs/susfs.c && test -f include/linux/susfs.h
          grep -q 'CONFIG_KSU_SUSFS' fs/Makefile
          echo "SUSFS kernel side added: $(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h)"

      - name: Add KernelSU Next (driver from Quallenauge)
        if: inputs.ksu
        working-directory: kernel
        env:
          SUSFS_EXTRA: ${{ inputs.susfs_extra }}
          DRIVER_REPO: ${{ inputs.driver_repo }}
          DRIVER_COMMIT: ${{ inputs.driver_commit }}
          MGR_UAPI: ${{ needs.manager.outputs.uapi }}
          MGR_MIN_KERNEL: ${{ needs.manager.outputs.min_kernel }}
          HOOK_MODE: ${{ inputs.hook_mode }}
        run: |
          set -euo pipefail

          # only drivers/kernelsu is taken from that kernel tree (85 files, KernelSU Next v3.4.2-legacy)
          git remote add qdrv "https://github.com/$DRIVER_REPO"
          git fetch --depth=1 qdrv "$DRIVER_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$DRIVER_COMMIT"
          git checkout FETCH_HEAD -- drivers/kernelsu
          test -f drivers/kernelsu/Kbuild
          grep -nE '^KSU_GIT_TAG|^KSU_VERSION_OVERRIDE' drivers/kernelsu/Kbuild || true

          # UAPI version of the driver. The manager must speak the same one.
          UAPI="$(grep -rhoE 'KERNEL_SU_UAPI_VERSION[[:space:]=]+[0-9]+' drivers/kernelsu/uapi | grep -oE '[0-9]+$' | head -n1)"
          echo "KernelSU-Next driver UAPI version: $UAPI"
          if [ -n "$MGR_UAPI" ] && [ "$MGR_UAPI" != "$UAPI" ]; then
            echo "::error::driver UAPI ($UAPI) != manager UAPI ($MGR_UAPI). Use manager_ref v3.4.2 or v3.4.1 (UAPI 5), not dev (UAPI 6)."
            exit 1
          fi

          # The manager shows "kernel too old" below its minimum. The driver reports KSU_VERSION_OVERRIDE.
          DRV_VER="$(grep -E '^KSU_VERSION_OVERRIDE' drivers/kernelsu/Kbuild | grep -oE '[0-9]+' | head -n1 || true)"
          echo "Driver reports version: ${DRV_VER:-unknown} | manager minimum: ${MGR_MIN_KERNEL:-unknown}"
          if [ -n "$DRV_VER" ] && [ -n "$MGR_MIN_KERNEL" ] && [ "$DRV_VER" -lt "$MGR_MIN_KERNEL" ]; then
            echo "::error::driver version $DRV_VER is older than the minimum this manager supports ($MGR_MIN_KERNEL). Use an older manager_ref (v3.4.2)."
            exit 1
          fi

          # same as KernelSU-Next's setup.sh: Makefile + Kconfig hooks (the directory is real, not a symlink)
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # SUSFS v2.4.0 has one feature this driver's Kconfig (SUSFS 2.3.0 era) does not define:
          # PRIORITY_UID_FILTER. Define it so olddefconfig keeps it (an undefined symbol is silently dropped).
          # HIDE_KSU_SUSFS_SYMBOLS already exists in the driver under the same name as in the patch.
          SUSFS_EXTRA_DEFAULT=y; [ "$SUSFS_EXTRA" = "true" ] || SUSFS_EXTRA_DEFAULT=n
          python3 - "$SUSFS_EXTRA_DEFAULT" <<'PY'
          import sys
          d = sys.argv[1]
          p = 'drivers/kernelsu/Kconfig'
          s = open(p).read()
          if 'KSU_SUSFS_PRIORITY_UID_FILTER' not in s:
              assert 'config KSU_SUSFS_SUS_MAP' in s, 'SUSFS menu anchor not found in the driver Kconfig'
              add = (
                  "config KSU_SUSFS_PRIORITY_UID_FILTER\n"
                  "\tbool \"Filter priority uids in ioprio_set/ioprio_get (SUSFS v2.4.0)\"\n"
                  "\tdepends on KSU_SUSFS\n"
                  "\tdefault " + d + "\n\n"
              )
              a = s.index('config KSU_SUSFS_SUS_MAP')
              b = s.index('endmenu', a)
              s = s[:b] + add + s[b:]
              open(p, 'w').write(s)
              print('Kconfig: added KSU_SUSFS_PRIORITY_UID_FILTER (default ' + d + ')')
          PY

          # Manual hooks: the driver must offer the hook entry points the next step calls.
          for f in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_newfstat_ret \
                   ksu_handle_sys_read ksu_handle_input_handle_event ksu_handle_sys_reboot; do
            grep -rqE "^(int|void) $f\(" drivers/kernelsu || { echo "::error::driver has no $f"; exit 1; }
          done
          echo "driver hook entry points present"

      - name: Add KernelSU manual hooks
        if: ${{ inputs.ksu && inputs.hook_mode == 'manual' }}
        working-directory: kernel
        run: |
          set -euo pipefail
          # Hooks match the driver (Quallenauge drivers/kernelsu, same entry points as legacy-susfs): exec, faccessat, stat, newfstat ret,
          # read (init.rc), input (safe mode), reboot (supercall). setuid goes through the driver's own LSM hook.
          python3 - <<'PY'
          import re, sys
          def edit(path, fn):
              s = open(path).read()
              if 'ksu_handle_' in s:
                  print(path, 'already hooked'); return
              n = fn(s)
              assert n != s, path + ': anchor not found'
              open(path, 'w').write(n)
              print(path, 'hooked')
          def sub1(s, pat, rep, flags=re.S):
              r, c = re.subn(pat, rep, s, count=1, flags=flags)
              assert c == 1, 'anchor not found: ' + pat[:60]
              return r

          # fs/exec.c: __do_execve_file()  (driver: ksu_handle_execveat -> ksud + sucompat)
          edit('fs/exec.c', lambda s: sub1(s,
              r'(static int __do_execve_file\(int fd, struct filename \*filename,.*?\n\tint retval;\n\n\tif \(IS_ERR\(filename\)\)\n\t\treturn PTR_ERR\(filename\);\n)',
              r'\1\n\t/* KernelSU-Next manual hook */\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n')
              .replace('static int __do_execve_file(int fd, struct filename *filename,',
              'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n\t\t\t       void *envp, int *flags);\n\nstatic int __do_execve_file(int fd, struct filename *filename,', 1))

          # fs/open.c: do_faccessat()
          edit('fs/open.c', lambda s: sub1(s,
              r'(long do_faccessat\(int dfd, const char __user \*filename, int mode\)\n\{.*?\tif \(mode & ~S_IRWXO\)[^\n]*\n\t\treturn -EINVAL;\n)',
              r'\1\n\t/* KernelSU-Next manual hook */\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n')
              .replace('long do_faccessat(int dfd, const char __user *filename, int mode)\n{',
              'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,\n\t\t\t\tint *__unused_flags);\n\nlong do_faccessat(int dfd, const char __user *filename, int mode)\n{', 1))

          # fs/stat.c: vfs_statx() (su path) + newfstat return (init.rc size fix)
          def stat_c(s):
              s = sub1(s, r'(int vfs_statx\(int dfd, const char __user \*filename, int flags,\n[^\n]*\n\{\n\tstruct path path;\n\tint error = -EINVAL;\n\tunsigned int lookup_flags = LOOKUP_FOLLOW \| LOOKUP_AUTOMOUNT;\n)',
                       r'\1\n\t/* KernelSU-Next manual hook */\n\tksu_handle_stat(&dfd, &filename, &flags);\n')
              s = s.replace('int vfs_statx(int dfd, const char __user *filename, int flags,',
                  'extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n\nint vfs_statx(int dfd, const char __user *filename, int flags,', 1)
              s = sub1(s, r'(SYSCALL_DEFINE2\(newfstat, unsigned int, fd, struct stat __user \*, statbuf\)\n\{\n\tstruct kstat stat;\n\tint error = vfs_fstat\(fd, &stat\);\n\n\tif \(!error\)\n\t\terror = cp_new_stat\(&stat, statbuf\);\n)',
                       r'\1\n\t/* KernelSU-Next manual hook */\n\tif (!error)\n\t\tksu_handle_newfstat_ret(&fd, &statbuf);\n')
              return s
          edit('fs/stat.c', stat_c)

          # fs/read_write.c: read(2)  (init.rc proxy)
          edit('fs/read_write.c', lambda s: sub1(s,
              r'SYSCALL_DEFINE3\(read, unsigned int, fd, char __user \*, buf, size_t, count\)\n\{\n',
              'extern void ksu_handle_sys_read(unsigned int fd);\n\nSYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n{\n\t/* KernelSU-Next manual hook */\n\tksu_handle_sys_read(fd);\n\n'))

          # drivers/input/input.c: input_handle_event()  (volume-down safe mode)
          edit('drivers/input/input.c', lambda s: sub1(s,
              r'(static void input_handle_event\(struct input_dev \*dev,\n\t\t\t       unsigned int type, unsigned int code, int value\)\n\{\n\tint disposition = input_get_disposition\(dev, type, code, &value\);\n)',
              r'\1\n\t/* KernelSU-Next manual hook */\n\tksu_handle_input_handle_event(&type, &code, &value);\n')
              .replace('static void input_handle_event(struct input_dev *dev,',
              'extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n\nstatic void input_handle_event(struct input_dev *dev,', 1))

          # kernel/reboot.c: supercall entry
          def reboot_c(s):
              k = 'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{\n'
              i = s.index(k)
              s = s[:i] + 'extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n\t\t\t\t  void __user **arg);\n\n' + s[i:]
              j = s.index('\tint ret = 0;\n', s.index(k)) + len('\tint ret = 0;\n')
              return s[:j] + '\n\t/* KernelSU-Next supercall entry */\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n' + s[j:]
          edit('kernel/reboot.c', reboot_c)
          PY
          git diff --stat -- fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c kernel/reboot.c || true
          for f in fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c kernel/reboot.c; do
            grep -q 'ksu_handle_' "$f" || { echo "::error::manual hook missing in $f"; exit 1; }
          done
          echo "manual hooks applied"

      - name: Clone clang
        run: |
          git clone --depth=1 -b "${{ inputs.clang_branch }}" \
            "${{ inputs.clang_repo }}" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Configure
        working-directory: kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          EXTRA_CONFIGS: ${{ inputs.extra_configs }}
          WANT_KSU: ${{ inputs.ksu }}
          WANT_SUSFS: ${{ inputs.ksu && inputs.susfs }}
          SUSFS_EXTRA: ${{ inputs.susfs_extra }}
          HOOK_MODE: ${{ inputs.hook_mode }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          $MK "$DEFCONFIG"
          for frag in $EXTRA_CONFIGS; do
            $MK "$frag"
          done

          if [ "$WANT_KSU" = "true" ]; then
            scripts/config --file out/.config -e KSU
            if [ "$HOOK_MODE" = "manual" ]; then
              scripts/config --file out/.config -d KSU_SYSCALL_TABLE_HOOK -d KSU_KPROBES_HOOK -e KSU_MANUAL_HOOK
            elif [ "$HOOK_MODE" = "kprobes" ]; then
              scripts/config --file out/.config -d KSU_SYSCALL_TABLE_HOOK -e KSU_KPROBES_HOOK
            else
              scripts/config --file out/.config -d KSU_KPROBES_HOOK -e KSU_SYSCALL_TABLE_HOOK
            fi
            if [ "$WANT_SUSFS" = "true" ]; then
              [ "$HOOK_MODE" = "manual" ] || scripts/config --file out/.config -e KPROBES
              scripts/config --file out/.config \
                -e OVERLAY_FS -e TMPFS_XATTR -e TMPFS_POSIX_ACL \
                -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
                -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP \
                -d KSU_SUSFS_TRY_UMOUNT
          if [ "$SUSFS_EXTRA" = "true" ]; then
            scripts/config --file out/.config -e KSU_SUSFS_PRIORITY_UID_FILTER
          fi
            fi
          else
            scripts/config --file out/.config -d KSU
          fi
          $MK olddefconfig

          echo "--- resulting KernelSU config"
          grep -E "^CONFIG_(KSU|KPROBES|KRETPROBES|KALLSYMS|LTO_CLANG|CFI_CLANG)" out/.config || true

          if [ "$WANT_KSU" = "true" ]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU is not enabled"; exit 1; }
            if [ "$WANT_SUSFS" = "true" ]; then
              grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "::error::CONFIG_KSU_SUSFS is not enabled"; exit 1; }
              grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config || { echo "::error::SUSFS sub-options were not enabled"; exit 1; }
              if [ "$SUSFS_EXTRA" = "true" ]; then
                grep -q '^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y' out/.config || { echo "::error::KSU_SUSFS_PRIORITY_UID_FILTER not enabled"; exit 1; }
              fi
            fi
            if [ "$HOOK_MODE" = "manual" ]; then
              grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config || { echo "::error::MANUAL hook not enabled"; exit 1; }
              if grep -q '^CONFIG_KSU_KPROBES_HOOK=y' out/.config; then echo "::error::KPROBES hook still enabled"; exit 1; fi
            elif [ "$HOOK_MODE" = "kprobes" ]; then
              grep -q '^CONFIG_KSU_KPROBES_HOOK=y' out/.config || { echo "::error::KPROBES hook not enabled"; exit 1; }
            else
              grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' out/.config || { echo "::error::SYSCALL_TABLE hook not enabled"; exit 1; }
            fi
          fi

      - name: Build
        working-directory: kernel
        env:
          # Kbuild: "ifndef KSU_NEXT_MANAGER_SIZE/HASH" -> an empty value keeps the official defaults.
          # With build_manager the kernel accepts ONLY the APK built in the manager job.
          KSU_NEXT_MANAGER_SIZE: ${{ needs.manager.outputs.cert_size }}
          KSU_NEXT_MANAGER_HASH: ${{ needs.manager.outputs.cert_hash }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          echo "Manager signature for the kernel: size=${KSU_NEXT_MANAGER_SIZE:-default} hash=${KSU_NEXT_MANAGER_HASH:-default}"
          MK="make O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          # without pipefail the exit code of 'tee' hides a failed make
          set -o pipefail
          if ! $MK -j"$(nproc)" Image modules 2>&1 | tee -a ../build.log; then
            echo "::group::First errors"
            grep -nE "error:|\*\*\*|undefined reference" ../build.log | head -20 || true
            echo "::endgroup::"
            echo "::group::Single-threaded re-run for a readable error"
            $MK -j1 Image 2>&1 | tail -n 40 || true
            echo "::endgroup::"
            echo "::error::Kernel build failed - see the first errors above and the build-log artifact"
            exit 1
          fi

          $MK -j"$(nproc)" dtbs 2>&1 | tee -a ../build.log || true
          ACTUAL_RELEASE="$(cat out/include/config/kernel.release)"
          EXPECTED_RELEASE="${{ inputs.expected_kernel_release }}"
          echo "Kernel release: $ACTUAL_RELEASE"
          if [ "$ACTUAL_RELEASE" != "$EXPECTED_RELEASE" ]; then
            echo "::error::Kernel release mismatch: expected $EXPECTED_RELEASE, got $ACTUAL_RELEASE"; exit 1
          fi

      - name: Verify result
        working-directory: kernel
        env:
          WANT_KSU: ${{ inputs.ksu }}
          KSU_NEXT_MANAGER_HASH: ${{ needs.manager.outputs.cert_hash }}
        run: |
          REL="$(cat out/include/config/kernel.release)"
          EXPECTED_RELEASE="${{ inputs.expected_kernel_release }}"
          echo "Kernel release: $REL"
          test "$REL" = "$EXPECTED_RELEASE" || { echo "::error::kernel release mismatch"; exit 1; }
          if [ "$WANT_KSU" = "true" ]; then
            grep -q ' ksu_' out/System.map || { echo "::error::no ksu_* symbols in System.map - KernelSU was not linked"; exit 1; }
            echo "KernelSU symbols present: $(grep -c ' ksu_' out/System.map)"
            if [ "${{ inputs.susfs }}" = "true" ]; then
              grep -q ' susfs_' out/System.map || { echo "::error::no susfs_* symbols in System.map - SUSFS was not linked"; exit 1; }
              echo "SUSFS symbols present: $(grep -c ' susfs_' out/System.map)"
            fi
            if [ "${{ inputs.hook_mode }}" = "manual" ]; then
              for s in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_sys_read ksu_handle_input_handle_event ksu_handle_newfstat_ret; do
                grep -q " $s\$" out/System.map || { echo "::error::$s missing from System.map"; exit 1; }
              done
              echo "manual hook symbols linked"
            fi
            grep -q ' ksu_handle_sys_reboot' out/System.map || { echo "::error::ksu_handle_sys_reboot missing"; exit 1; }
            grep -q 'ksu_handle_sys_reboot' kernel/reboot.c || { echo "::error::reboot hook not applied to kernel/reboot.c"; exit 1; }
          fi
          if [ -n "$KSU_NEXT_MANAGER_HASH" ]; then
            grep -q "Manager signature hash: $KSU_NEXT_MANAGER_HASH" ../build.log || { echo "::error::custom manager signature hash was not picked up by Kbuild"; exit 1; }
            echo "Custom manager signature is in the kernel"
          fi
          case "$REL" in
            *-dirty) echo "::warning::kernel release ends with -dirty - vendor modules will not match the ROM" ;;
          esac

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/LICENSE
          cat > ak3/anykernel.sh <<'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom kernel for lunaa / EvolutionX Android 17 (KernelSU Next + SUSFS, new manager)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lunaa
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=none;
          PATCH_VBMETA_FLAG=auto;
          NO_MAGISK_CHECK=1;

          . tools/ak3-core.sh;

          # The stock boot ramdisk is lz4_legacy and magiskboot's decompression
          # of it aborts ("Splitting image failed"). Only the kernel is replaced,
          # so keep the ramdisk bytes untouched: unpack with -n (no decompress);
          # RAMDISK_COMPRESSION=none above makes repack use -n as well.
          magiskboot() {
            if [ "$1" = unpack ]; then
              shift;
              "$BIN/magiskboot" unpack -n "$@";
            else
              "$BIN/magiskboot" "$@";
            fi;
          }

          split_boot;
          flash_boot;
          AKEOF
          sed -i 's/^          //' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          zip -r9 "../lunaa-evolutionx-kernel-newmgr-$(date +%Y%m%d).zip" . -x '.git*'

      - name: Collect modules
        run: |
          mkdir -p extra/modules
          cp kernel/out/include/config/kernel.release extra/ || true
          cp kernel/out/.config extra/config || true
          find kernel/out -name '*.ko' -exec cp {} extra/modules/ \; 2>/dev/null || true
          echo "Built modules: $(ls extra/modules | wc -l)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build summary (NEWMGR: manager from KernelSU-Next dev 204f0071)"
            echo "- Kernel commit: \`$(git -C kernel rev-parse --short=12 HEAD 2>/dev/null || echo n/a)\`"
            echo "- Kernel release: \`$(cat kernel/out/include/config/kernel.release 2>/dev/null || echo n/a)\`"
            echo "- KernelSU Next: $(git -C kernel/KernelSU-Next describe --tags --always 2>/dev/null || echo none)"
            echo "- Manager APK: ${{ inputs.build_manager && 'built (artifact ksun-manager-apk-newmgr)' || 'not built' }}, manager UAPI: \`${{ needs.manager.outputs.uapi }}\`"
            echo "- SUSFS: \`$(grep -E '^#define SUSFS_VERSION' kernel/include/linux/susfs.h 2>/dev/null | cut -d' ' -f3 || echo none)\`"
            grep -E "^CONFIG_(KSU|SUSFS)" kernel/out/.config 2>/dev/null | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-evolutionx-kernel-newmgr
          path: |
            lunaa-evolutionx-kernel-*.zip

      - name: Upload config, release string and modules
        uses: actions/upload-artifact@v4
        with:
          name: lunaa-config-and-modules-newmgr
          path: extra/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-newmgr
          path: build.log
          if-no-files-found: ignore
